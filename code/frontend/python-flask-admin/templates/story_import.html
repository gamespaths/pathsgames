{% extends 'base.html' %}
{% block title %}Import Story — Paths Games Admin{% endblock %}
{% block content %}
<h2 class="pg-page-title"><i class="fas fa-file-import"></i>Import Story</h2>
{% if error %}<div class="pg-alert pg-alert-danger mb-3"><i class="fas fa-exclamation-triangle"></i><span>{{ error }}</span></div>{% endif %}

<div class="pg-card">
  <p style="color:var(--color-ash)">Paste a <code>tutorial_story.json</code> document, or upload a file. It will be sent to
    <code>POST /api/admin/stories/import</code>.</p>
  <form method="post" action="{{ url_for('story_import.page') }}" enctype="multipart/form-data">
    <div class="mb-3">
      <label class="pg-label"><i class="fas fa-upload me-1"></i>Upload JSON file (optional)</label>
      <input class="pg-input" type="file" name="file" accept="application/json,.json">
    </div>
    <div class="mb-3">
      <label class="pg-label"><i class="fas fa-code me-1"></i>or paste JSON</label>
      <textarea class="pg-textarea" name="payload" rows="16" placeholder='{ "story": { ... }, "texts": [ ... ], ... }'>{{ payload }}</textarea>
    </div>
    <button class="pg-btn pg-btn-gold" type="submit"><i class="fas fa-file-import"></i>Import</button>
  </form>
</div>
{% endblock %}
