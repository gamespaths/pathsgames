{% extends 'base.html' %}
{% block title %}Login — Paths Games Admin{% endblock %}
{% block guest_content %}
<div class="pg-login-wrap">
  <div class="pg-login-box">
    <div class="text-center mb-4">
      <div style="font-size:3rem"><i class="fas fa-dice-d20 dice-bounce" style="color:var(--color-gold-light)"></i></div>
      <h1 style="font-family:'Cinzel Decorative',serif;font-size:1.5rem;color:var(--color-gold-light)">Paths Games</h1>
      <p style="font-family:'Cinzel',serif;font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;color:var(--color-ember)">Admin Panel</p>
    </div>
    <p style="color:var(--color-ash);font-size:.9rem;text-align:center" class="mb-4">
      Paste your admin JWT access token to access the control panel.
    </p>
    {% if error %}<div class="pg-alert pg-alert-danger mb-3"><i class="fas fa-exclamation-triangle"></i><span>{{ error }}</span></div>{% endif %}
    <form method="post" action="{{ url_for('auth.login') }}">
      <div class="mb-3">
        <label class="pg-label"><i class="fas fa-server me-1"></i>Admin server</label>
        <input class="pg-input" type="text" name="server" value="{{ admin_server }}" placeholder="http://localhost:8044">
      </div>
      <div class="mb-3">
        <label class="pg-label"><i class="fas fa-key me-1"></i>JWT access token</label>
        <textarea class="pg-textarea" name="token" rows="4" placeholder="eyJ…" required></textarea>
      </div>
      <button class="pg-btn pg-btn-gold w-100" type="submit"><i class="fas fa-sign-in-alt"></i>Enter</button>
    </form>
  </div>
</div>
{% endblock %}
