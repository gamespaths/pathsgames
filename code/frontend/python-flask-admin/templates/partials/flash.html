{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    <div class="mb-3">
      {% for category, message in messages %}
        <div class="pg-alert pg-alert-{{ 'danger' if category == 'danger' else ('warning' if category == 'warning' else 'success') }} mb-2">
          <i class="fas fa-{{ 'exclamation-triangle' if category == 'danger' else ('exclamation-circle' if category == 'warning' else 'check-circle') }}"></i>
          <span>{{ message }}</span>
        </div>
      {% endfor %}
    </div>
  {% endif %}
{% endwith %}
