<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ t('nav.brand') }}{% endblock %}</title>

  {# --- Google Consent Mode v2 defaults: analytics stays denied until the user accepts --- #}
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('consent', 'default', {
      ad_storage: 'denied',
      ad_user_data: 'denied',
      ad_personalization: 'denied',
      analytics_storage: 'denied',
      wait_for_update: 500
    });
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cinzel+Decorative:wght@400;700&family=Crimson+Text:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/game.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/flaskgame.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/accessibility.css') }}">
</head>
<body class="theme-{{ theme }}">
  {% include 'partials/navbar.html' %}

  <main class="pg-main">
    {% block content %}{% endblock %}
  </main>

  {% include 'partials/footer.html' %}
  {% include 'partials/cookie_banner.html' %}

  <script>
    window.PG_GTM_ID = {{ gtm_id|tojson }};
    window.PG_CONSENT = {{ consent|tojson }};
  </script>
  <script src="{{ url_for('static', filename='js/consent.js') }}" defer></script>
</body>
</html>
