{% if not consent %}
<div class="pg-cookie-banner" role="dialog" aria-label="{{ t('modals.cookies.title') }}">
  <div class="pg-cookie-banner__inner">
    <div class="pg-cookie-banner__text">
      <strong><i class="fas fa-cookie-bite me-2"></i>{{ t('modals.cookies.title') }}</strong>
      <p>{{ t('modals.cookies.intro') }}</p>
    </div>
    <div class="pg-cookie-banner__actions">
      <form method="post" action="{{ url_for('prefs.set_consent') }}" class="pg-inline-form">
        <input type="hidden" name="next" value="{{ request.full_path }}">
        <input type="hidden" name="consent" value="necessary">
        <button type="submit" class="btn-secondary-pg">Reject all</button>
      </form>
      <a href="{{ url_for('legal.cookies') }}" class="btn-secondary-pg">{{ t('modals.cookies.manage') }}</a>
      <form method="post" action="{{ url_for('prefs.set_consent') }}" class="pg-inline-form">
        <input type="hidden" name="next" value="{{ request.full_path }}">
        <input type="hidden" name="consent" value="all">
        <button type="submit" class="btn-start-game">Accept all</button>
      </form>
    </div>
  </div>
</div>
{% endif %}
