version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pathsgames_postgres
    environment:
      POSTGRES_DB: pathsgames_dev
      POSTGRES_USER: pathsgames
      POSTGRES_PASSWORD: pathsgames
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pathsgames"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: pathsgames_backend_node
    environment:
      ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: pathsgames_dev
      DB_USER: pathsgames
      DB_PASSWORD: pathsgames
      DATABASE_URL: postgresql://pathsgames:pathsgames@postgres:5432/pathsgames_dev?schema=public
      PUBLIC_PORT: 8042
      ADMIN_PORT: 8044
      JWT_SECRET: PathsGamesDevSecret2026_MustBeAtLeast32Chars!
      DEV_ENDPOINTS_ENABLED: "true"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:5172,http://localhost:8080"
    ports:
      - "8042:8042"
      - "8044:8044"
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npx prisma db push --accept-data-loss && (node prisma/seed.js || echo 'seed skipped, continuing') && npm run start"

  nginx:
    image: nginx:latest
    container_name: pathsgames_nginx
    ports:
      - "3080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    command: nginx -g "daemon off;"

volumes:
  postgres_data:
