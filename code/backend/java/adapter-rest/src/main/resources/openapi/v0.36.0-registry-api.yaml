openapi: 3.0.3
info:
  title: Paths Games — Registry API
  description: |
    Step 36 — the match registry becomes readable.

    The registry is the key-value game state of a match (`gaming_state_registry`): the flags,
    counters and progress markers that events, choices and the engine write, and that events,
    edges, weather rules and choice options read back as conditions. Until v0.36.0 it rode
    only as a flat `registry[]` array on `/api/match/{uuidMatch}/info` and nothing described
    what a key meant.

    ## What v0.36.0 adds

    - **`GET /api/match/{uuidMatch}/registry`** — the keys grouped by **category**, which is
      the `"group"` column of the key's `list_keys` definition. A key with no group falls into
      the `null` category rather than being dropped.
    - Every entry is joined with its definition, so it carries `category`, `visible`,
      `priority`, `idCard` and the resolved `card` alongside the value the engine wrote, plus
      `idCharacter` — **the character who wrote the value last**, null while nothing has.
    - The same six fields are added to the `registry[]` entries of `/api/match/{uuidMatch}/info`.
      The duplication is deliberate: the game board already loads `/info`, so it can render the
      registry section with no second request and can never disagree with itself.

    ## Visibility

    A key is visible when its `list_keys.visibility` is `PUBLIC`; anything else hides it. The
    column is free text, so a typo hides a key rather than leaking one — the safe direction.

    `?includeHidden=true` returns the hidden keys too. It is **owner-only**, like the endpoint
    itself, and it exists for debugging a story: a hidden key is usually a puzzle the player has
    not solved yet. `/info` never returns hidden keys, whatever the caller asks.

    ## Values

    A key holds a SET of values, returned as `values`. Step 36.1 made the set the shape every
    key answers with: a single-valued key has one member, a multi-valued one may have many, and
    a key whose set is empty has none. Members are rendered strings — a numeric value is stored
    apart from a textual one, but both read back the same way, and booleans are integers by
    convention (`0` is no, anything else is yes).

    `multiValue` says which kind the key is. A multi-valued key ACCUMULATES: each write adds a
    member, writing a member it already holds changes nothing, and `value_to_remove` takes one
    member away instead of clearing the key. A single-valued key replaces, exactly as before.
    The kind is declared per key on `list_keys.multi_value` and mirrored onto the state row when
    the match first writes it, so a running match keeps the behaviour it was born with.

    ## Conditions over a set

    `=` and `!=` quantify existentially: `=` is met when ANY member equals the value, `!=` when
    NONE does. `>` and `<` quantify universally: met when EVERY member compares that way, and
    never over an empty set — vacuous truth would open a door, and a typo must close one.

    ## Ordering

    Entries are sorted by category, then by the key's `priority`, then by key name. Groups come
    out in the order their first entry appears, so the ordering is stable across calls. Inside
    an entry the members are ordered by the backend: numbers numerically first, then everything
    else alphabetically, so every client renders the same set the same way.
  version: 0.36.1
servers:
  - url: http://localhost:8042
    description: Local development (public/player API)
tags:
  - name: registry
    description: Match key-value game state
security:
  - bearerAuth: []
paths:
  /api/match/{uuidMatch}/registry:
    get:
      tags: [registry]
      summary: The match registry, grouped by category (owner-only)
      description: |
        Returns the visible registry keys of the match. Only the match creator may read it;
        any other caller gets 404, so a match nobody may see is indistinguishable from one
        that does not exist.
      parameters:
        - name: uuidMatch
          in: path
          required: true
          schema: { type: string }
          description: Match uuid.
        - name: lang
          in: query
          required: false
          schema: { type: string, default: en }
          description: Language used to resolve each key's card. Falls back to English.
        - name: includeHidden
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: |
            Include keys whose definition is not `PUBLIC`. Owner-only, like the endpoint itself.
      responses:
        '200':
          description: The registry, grouped by category.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchRegistryResponse'
              examples:
                tutorial:
                  summary: A numeric counter, and a multi-valued key holding three clues
                  value:
                    groups:
                      - category: tutorial
                        entries:
                          - uuid: 3f2b1c4d-1111-4a7b-8c9d-0e1f2a3b4c5d
                            key: tutorial_progress
                            values: ["3"]
                            multiValue: false
                            idCharacter: 12
                            category: tutorial
                            visible: true
                            priority: 1
                            idCard: 950
                            card:
                              title: Training progress
                              description: How far along the training you are.
                      - category: evidence
                        entries:
                          - uuid: 7a8b9c0d-2222-4a7b-8c9d-0e1f2a3b4c5d
                            key: monastery_records
                            values: ["ledger", "letter", "seal"]
                            multiValue: true
                            idCharacter: null
                            category: evidence
                            visible: true
                            priority: 1
                            idCard: null
                            card: null
        '400':
          description: The match uuid is missing or blank.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: No authenticated user on the request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: The match does not exist, or the caller does not own it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    MatchRegistryResponse:
      type: object
      properties:
        groups:
          type: array
          items: { $ref: '#/components/schemas/RegistryGroup' }
    RegistryGroup:
      type: object
      properties:
        category:
          type: string
          nullable: true
          description: The `list_keys."group"` of the keys in this bucket; null when unset.
        entries:
          type: array
          items: { $ref: '#/components/schemas/RegistryEntry' }
    RegistryEntry:
      type: object
      properties:
        uuid:
          type: string
          description: Uuid of the `gaming_state_registry` row.
        key:
          type: string
        values:
          type: array
          description: >-
            The SET of values the key holds, ordered by the backend. One member for a
            single-valued key, several for a multi-valued one, none when the set is empty.
          items:
            type: string
        multiValue:
          type: boolean
          description: True when the key accumulates values instead of replacing them.
        idCharacter:
          type: integer
          format: int64
          nullable: true
          description: The character that wrote this value last; null while nothing has.
        category:
          type: string
          nullable: true
        visible:
          type: boolean
          description: False only in an `includeHidden` response.
        priority:
          type: integer
          nullable: true
        idCard:
          type: integer
          nullable: true
        card:
          nullable: true
          description: The key's card, resolved in `lang`; null when the key has none.
          allOf:
            - $ref: '#/components/schemas/Card'
    Card:
      type: object
      properties:
        title: { type: string, nullable: true }
        description: { type: string, nullable: true }
        urlImage: { type: string, nullable: true }
        alternativeImage: { type: string, nullable: true }
        copyrightText: { type: string, nullable: true }
        linkCopyright: { type: string, nullable: true }
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          enum: [UNAUTHENTICATED, INVALID_INPUT, MATCH_NOT_FOUND]
        message: { type: string }
        timestamp: { type: integer, format: int64 }
