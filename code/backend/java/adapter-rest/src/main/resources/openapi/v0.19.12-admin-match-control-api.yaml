openapi: 3.0.3
info:
  title: Paths Games — Admin Match Control API
  description: |
    OpenAPI specification for the **admin match control** endpoints introduced
    in version 0.19.12.

    The admin console can already list every match (`GET /api/admin/matches`,
    v0.19.10). Version 0.19.12 makes the Matches section actionable: an admin
    can modify a match (status and/or name), stop / pause / resume it, and
    delete a match that has been stopped.

    A match moves through these lifecycle statuses:
    `CREATED → RUNNING → PAUSED → ENDED → GAMEOVER`. `ENDED` and `GAMEOVER`
    are **terminal** ("stopped"): only a match in a terminal status may be
    deleted.

    All endpoints require the `ADMIN` role; role enforcement is handled by each
    backend's JWT filter / middleware (the AWS Lambda handler checks the role
    field explicitly).

    Version 0.36.2 added the registry edit pair (`PUT` / `DELETE
    /api/admin/matches/{uuidMatch}/registry`); 0.36.4 documents it here and
    refuses a `PUT` naming a key the story does not declare.
  version: 0.36.4
  contact:
    name: Paths Games
    url: https://paths.games
  license:
    name: GPL v3
    url: https://www.gnu.org/licenses/gpl-3.0

servers:
  - url: http://localhost:8042
    description: Local development server

tags:
  - name: Admin Matches
    description: Admin-only match control

security:
  - bearerAuth: []

paths:
  /api/admin/matches/statuses:
    get:
      tags: [Admin Matches]
      summary: List the valid match statuses
      description: |
        Returns every valid match status, each flagged `terminal` when a match
        in that status is "stopped" (and therefore deletable).
      operationId: listMatchStatuses
      responses:
        '200':
          description: The valid match statuses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MatchStatus'
        '403':
          description: Caller does not hold the ADMIN role

  /api/admin/matches/{uuidMatch}/info:
    get:
      tags: [Admin Matches]
      summary: Get the full detail of any match (admin)
      description: |
        Returns the full match detail (summary + runtime state: locations and
        registry) for the admin console. Unlike `GET /api/match/{uuidMatch}/info`
        — which is scoped to the calling player and returns `404` for matches
        created by other users — this endpoint has **no ownership check** and
        works for every match.

        v0.28.6 — it also returns EVERY story location in `locations[]`, with no
        visited filter, so the console can render the full gaming_state_locations
        runtime table. The fog-of-war gating on the `locationsActive[].neighbors[]`
        cards (`card`, `cardLocationFrom`, `cardLocationTo`) is unchanged and
        identical to the player endpoint.

        v0.29.0 — every entry of `locationsActive[].events[]` carries `available` and,
        when false, `reason` (see the Step 29 events API). The console evaluates them
        against the same reference character the player endpoint uses, so it sees exactly
        the flags the player would.
      operationId: getAdminMatchInfo
      parameters:
        - $ref: '#/components/parameters/UuidMatch'
      responses:
        '200':
          description: >
            The full match detail (same shape as GET /api/match/{uuidMatch}/info,
            except `locations[]` is NOT filtered to the visited locations)
          content:
            application/json:
              schema:
                type: object
        '404':
          description: No match exists with the given uuid

  /api/admin/matches/{uuidMatch}:
    put:
      tags: [Admin Matches]
      summary: Update a match (status and/or name)
      description: |
        Updates the admin-editable fields of a match. Both body fields are
        optional, but at least one must be provided. A `null`/absent field is
        left unchanged.
      operationId: updateMatch
      parameters:
        - $ref: '#/components/parameters/UuidMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatchUpdateRequest'
      responses:
        '200':
          description: Match updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchActionResult'
        '400':
          description: No field provided, or an invalid status value
        '404':
          description: No match exists with the given uuid
    delete:
      tags: [Admin Matches]
      summary: Delete a stopped match
      description: |
        Deletes a match together with its derived runtime state (locations and
        registry). Only matches in a terminal status (`ENDED` / `GAMEOVER`)
        may be deleted — a non-terminal match returns `409 MATCH_NOT_STOPPED`.
      operationId: deleteMatch
      parameters:
        - $ref: '#/components/parameters/UuidMatch'
      responses:
        '200':
          description: Match deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchActionResult'
        '404':
          description: No match exists with the given uuid
        '409':
          description: The match is not stopped (status is not ENDED/GAMEOVER)

  /api/admin/matches/{uuidMatch}/registry:
    put:
      tags: [Admin Matches]
      summary: Write one registry key of a match (v0.36.2)
      description: |
        The console correcting one key. The write goes through the ordinary
        engine, so a single key is REPLACED and a multi-valued one GAINS the
        member, and either way the match log keeps a `REGISTRY_CHANGE` row.
        Since v0.36.4 a key the story does not declare is refused
        (`400 UNKNOWN_KEY`): a typo would otherwise leave behind an orphan key
        the player never sees and the console cannot tell from an engine bug.
      operationId: upsertMatchRegistry
      parameters:
        - $ref: '#/components/parameters/UuidMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistryEditRequest'
      responses:
        '200':
          description: The key as it stands after the write
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistryEditResult'
        '400':
          description: No key named (`INVALID_INPUT`), or a key the story does not declare (`UNKNOWN_KEY`)
        '404':
          description: No match exists with the given uuid
    delete:
      tags: [Admin Matches]
      summary: Take one value away from a registry key (v0.36.2)
      description: |
        Removes the named member of a multi-valued key, or compares-and-clears
        a single one. Without `value` the key is emptied whatever it holds —
        the key stays, its set does not. Unlike the `PUT`, an undeclared key is
        accepted here: cleaning an orphan row up is the point of the verb.
      operationId: deleteMatchRegistry
      parameters:
        - $ref: '#/components/parameters/UuidMatch'
        - name: key
          in: query
          required: true
          schema:
            type: string
          description: The registry key to edit
        - name: value
          in: query
          required: false
          schema:
            type: string
          description: The member to take away; omit to empty the key outright
      responses:
        '200':
          description: The key as it stands after the removal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistryEditResult'
        '400':
          description: No key named (`INVALID_INPUT`)
        '404':
          description: No match exists with the given uuid

  /api/admin/matches/{uuidMatch}/stop:
    post:
      tags: [Admin Matches]
      summary: Stop a match (set status to ENDED)
      operationId: stopMatch
      parameters:
        - $ref: '#/components/parameters/UuidMatch'
      responses:
        '200':
          description: Match stopped
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchActionResult'
        '404':
          description: No match exists with the given uuid

  /api/admin/matches/{uuidMatch}/pause:
    post:
      tags: [Admin Matches]
      summary: Pause a match (set status to PAUSED)
      operationId: pauseMatch
      parameters:
        - $ref: '#/components/parameters/UuidMatch'
      responses:
        '200':
          description: Match paused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchActionResult'
        '404':
          description: No match exists with the given uuid

  /api/admin/matches/{uuidMatch}/resume:
    post:
      tags: [Admin Matches]
      summary: Resume a match (set status to RUNNING)
      operationId: resumeMatch
      parameters:
        - $ref: '#/components/parameters/UuidMatch'
      responses:
        '200':
          description: Match resumed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchActionResult'
        '404':
          description: No match exists with the given uuid

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    UuidMatch:
      name: uuidMatch
      in: path
      required: true
      description: The match uuid
      schema:
        type: string
  schemas:
    MatchStatus:
      type: object
      properties:
        value:
          type: string
          enum: [CREATED, RUNNING, PAUSED, ENDED, GAMEOVER]
          example: ENDED
        terminal:
          type: boolean
          description: True when a match in this status is stopped (deletable)
          example: true
    MatchUpdateRequest:
      type: object
      properties:
        status:
          type: string
          enum: [CREATED, RUNNING, PAUSED, ENDED, GAMEOVER]
          description: New status; omit to leave unchanged
        name:
          type: string
          description: New name; omit to leave unchanged
    RegistryEditRequest:
      type: object
      required: [key]
      properties:
        key:
          type: string
          description: The registry key to write; the story must declare it
          example: evidence_found
        value:
          type: string
          description: The value to write, or the member to join; omit to clear
          example: ledger
    RegistryEditResult:
      type: object
      properties:
        key:
          type: string
          example: evidence_found
        values:
          type: array
          description: The whole SET the key holds after the edit, backend-ordered
          items:
            type: string
          example: [ledger, letter]
    MatchActionResult:
      type: object
      properties:
        status:
          type: string
          description: The operation outcome
          enum: [UPDATED, DELETED]
          example: UPDATED
        uuid:
          type: string
          example: 3f7ec2f9-d9e7-4d20-a19e-2a9e9da9e9f4
