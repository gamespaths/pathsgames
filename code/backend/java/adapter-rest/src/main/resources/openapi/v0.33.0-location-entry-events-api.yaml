tags:
  - name: Gameplay
    description: Automatic location events (Step 33) — no new endpoints

components:
  schemas:

    AutomaticEvent:
      type: object
      description: |
        One automatic location event the engine fired. Rides on every response that can
        cause an arrival.
      properties:
        trigger:
          type: string
          enum: [FIRST_ENTRY, SUBSEQUENT_ENTRY, MOVE_INTO_EMPTY_LOCATION, COUNTER_ZERO, CHARACTER_START_TIME]
          description: Why it fired.
          example: FIRST_ENTRY
        idLocation:
          type: integer
          format: int64
          description: The location whose column named this event.
          example: 90002
        eventUuid:
          type: string
          description: The event that ran; index 0 of its own chain.
          example: 6b1f7a2c-6f3e-4a5d-9c11-0b2d3e4f5a60
        card:
          $ref: '#/components/schemas/CardInfo'
        effects:
          type: array
          description: The effect rows applied, in chain order.
          items:
            $ref: '#/components/schemas/AppliedEffect'
        statChanges:
          type: array
          items:
            $ref: '#/components/schemas/StatChange'
        locationChanges:
          type: array
          description: Characters this event moved. Each move is itself an arrival.
          items:
            $ref: '#/components/schemas/LocationChange'
        gameOver:
          type: boolean
          description: The event was the story's `id_event_end_game`.

    CounterZeroItem:
      type: object
      description: |
        One automatic event a time-start fired, **as told to this caller**. A list, because
        several counters can run out on the same time-start.
      properties:
        trigger:
          type: string
          enum: [COUNTER_ZERO, CHARACTER_START_TIME]
        idLocation:
          type: integer
          format: int64
          example: 90001
        card:
          allOf:
            - $ref: '#/components/schemas/CardInfo'
          nullable: true
          description: |
            The **event's** card — what happened. **Absent** when `visibility` is
            `ANONYMOUS`, together with the other two: a name that never leaves the server
            cannot leak, and neither can what happened in a place the player cannot know.

            Until v0.33.1 this field carried the *location's* card, so the player woke to
            the name of a place instead of the news; the place moved to `cardLocation`.
        cardLocation:
          allOf:
            - $ref: '#/components/schemas/CardInfo'
          nullable: true
          description: |
            The location's card — `list_locations.id_card`, which is how a place has been
            named since v0.28.5. Null when `ANONYMOUS`, and null when the location authors
            no card of its own.
        cardEffects:
          type: array
          description: |
            The effect rows the event applied, in chain order — same shape
            `execute-event` returns. Each row's **own** card is the narrative the board
            renders. Empty when `ANONYMOUS`, and empty when the event applied nothing.
          items:
            $ref: '#/components/schemas/AppliedEffect'
        eventUuid:
          type: string
        clock:
          type: integer
          description: The new clock the time-start advanced to.
          example: 7
        visibility:
          type: string
          enum: [FULL, NAMED, ANONYMOUS]
          description: |
            `FULL` the recipient is standing there, `NAMED` they have been there before,
            `ANONYMOUS` they never have.

    LocationTriggerColumns:
      type: object
      description: |
        The `list_locations` columns the engine reads. Authored through admin CRUD and story
        import; all nullable, and a null column is simply not a trigger. Validated by
        `R9_AUTOMATIC_EVENT_CHOICES` and `R9_AUTOMATIC_EVENT_TYPE`.
      properties:
        idEventIfFirstTime:
          type: integer
          nullable: true
        idEventNotFirstTime:
          type: integer
          nullable: true
        idEventIfCharacterEnterEmptyLocation:
          type: integer
          nullable: true
        idEventIfCharacterStartTime:
          type: integer
          nullable: true
        idEventIfCounterZero:
          type: integer
          nullable: true
        priorityAutomaticEvent:
          type: integer
          nullable: true
          description: Lower runs first; ties broken by location id.

    LocationStateFlags:
      type: object
      description: |
        The two flags of `gaming_state_locations`, which mean different things and must not
        be confused.
      properties:
        flagAlreadyActived:
          type: integer
          description: Step 26 — this location's **counter has been consumed**. One-shot latch.
          example: 0
        flagVisited:
          type: integer
          description: |
            Step 33 — the **party** has entered this location at least once. Match-scoped,
            so first entry is the match's and not the character's. Seeded to 1 on the story's
            `id_location_start` at match creation.
          example: 1
        clockCounter:
          type: integer

    # ── referenced shapes, defined in full in the specs that own them ──

    CardInfo:
      type: object
      description: See `v0.16.0-content-detail-api.yaml`.
      properties:
        idCard: { type: integer }
        title: { type: string }
        description: { type: string }

    AppliedEffect:
      type: object
      description: See `v0.29.0-events-api.yaml`.
      properties:
        eventUuid: { type: string }
        effectUuid: { type: string }
        statistic: { type: string }
        value: { type: integer }
        target: { type: string }
        characterUuids:
          type: array
          items: { type: string }
        card:
          $ref: '#/components/schemas/CardInfo'

    StatChange:
      type: object
      description: See `v0.29.0-events-api.yaml`.
      properties:
        characterUuid: { type: string }
        statistic: { type: string }
        before: { type: integer }
        after: { type: integer }
        delta: { type: integer }

    LocationChange:
      type: object
      description: See `v0.29.0-events-api.yaml`.
      properties:
        characterUuid: { type: string }
        fromLocationUuid: { type: string, nullable: true }
        toLocationUuid: { type: string }
