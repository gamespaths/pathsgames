openapi: 3.0.3
info:
  title: Paths Games — Step 41 security (rate limiting and CSRF)
  description: |
    v0.37.7 — two guards on the two endpoints anyone can hit from a browser.

    **CSRF token.** Every login-shaped response (`POST /api/auth/guest`,
    `POST /api/auth/guest/resume`, `POST /api/auth/refresh`) and `GET /api/auth/me`
    carry a `csrfToken` bound to the access token they answer with:
    `base64url(HMAC-SHA256(secret, "csrf:" + accessToken))`, no padding, nothing
    stored. `POST /api/matches` requires it back as the `X-CSRF-TOKEN` header and
    refuses the creation otherwise (403 `CSRF_TOKEN_MISSING` / `CSRF_TOKEN_INVALID`).
    A refreshed access token comes with a new token. Enforcement is switched by
    `CSRF_ENFORCED` (default `true`).

    **Rate limits.** `POST /api/auth/guest` and `POST /api/matches` count attempts per
    source IP (first `X-Forwarded-For` hop, else the socket peer) in a fixed window and
    answer 429 `RATE_LIMITED` past the limit, with a `Retry-After` header and the same
    number as `retryAfterSeconds` in the body. A refused attempt still counts. The
    limits are `RATE_LIMIT_GUEST_PER_IP` / `RATE_LIMIT_MATCH_PER_IP` (0 = disabled, the
    dev and Robot default; 10 in production) over `RATE_LIMIT_WINDOW_SECONDS` (3600).
    On `POST /api/matches` the CSRF check runs first, so a forged call never spends
    the window. Java and Python count in memory (per process); AWS counts on a
    DynamoDB item `RATELIMIT#<bucket>#<ip>` / `WINDOW#<start>` with a `ttl`.
  version: 0.37.7
servers:
  - url: /
paths:
  /api/auth/guest:
    post:
      tags: [auth]
      summary: Create a guest session (now rate limited, answers a csrfToken)
      operationId: createGuestSessionV0377
      responses:
        '201':
          description: Session created; `csrfToken` is the one `POST /api/matches` wants back.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestLoginResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/auth/me:
    get:
      tags: [auth]
      summary: Current user, plus the csrfToken of the bearer used to call it
      operationId: getCurrentUserV0377
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The user behind the bearer and its CSRF token.
          content:
            application/json:
              schema:
                type: object
                properties:
                  userUuid: { type: string }
                  username: { type: string }
                  role: { type: string }
                  csrfToken:
                    type: string
                    description: The token bound to the bearer of this request.
                  timestamp: { type: integer, format: int64 }
        '401':
          description: Missing or invalid access token.
  /api/matches:
    post:
      tags: [matches]
      summary: Create a match (now requires X-CSRF-TOKEN and is rate limited)
      operationId: createMatchV0377
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: X-CSRF-TOKEN
          required: true
          schema:
            type: string
          description: The `csrfToken` issued with the bearer in `Authorization`.
      responses:
        '201':
          description: Match created (unchanged, see v0.19.0-match-creation-api.yaml).
        '403':
          description: |
            `CSRF_TOKEN_MISSING` — no header; `CSRF_TOKEN_INVALID` — a token that does not
            belong to this bearer. Also `USER_BANNED` as before.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    RateLimited:
      description: Too many attempts from this source address in the current window.
      headers:
        Retry-After:
          description: Seconds until the window reopens.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RateLimitedResponse'
  schemas:
    GuestLoginResponse:
      type: object
      required: [userUuid, username, accessToken, accessTokenExpiresAt, refreshTokenExpiresAt, csrfToken]
      properties:
        userUuid: { type: string }
        username: { type: string }
        accessToken: { type: string }
        accessTokenExpiresAt: { type: integer, format: int64 }
        refreshTokenExpiresAt: { type: integer, format: int64 }
        csrfToken:
          type: string
          description: Echo it back as `X-CSRF-TOKEN` on `POST /api/matches` while this access token is in use.
    RateLimitedResponse:
      type: object
      required: [error, message, retryAfterSeconds, timestamp]
      properties:
        error:
          type: string
          enum: [RATE_LIMITED]
        message: { type: string }
        retryAfterSeconds: { type: integer }
        timestamp: { type: integer, format: int64 }
    ErrorResponse:
      type: object
      required: [error, message]
      properties:
        error: { type: string }
        message: { type: string }
        timestamp: { type: integer, format: int64 }
