openapi: 3.0.3
info:
  title: Paths Games — Single-player Match Creation API
  description: |
    OpenAPI specification for **Step 19: Single-player match creation**.

    A *match* is the running instance of a story for a single user. Step 19
    introduces the endpoints required to create a match, list the user's
    matches and retrieve the runtime state needed to render the in-game UI.

    Version 0.19.9 extends the match creation request with the creator
    loadout — character template, class, traits and a single-player flag —
    which is now persisted on the match.

    Version 0.19.10 adds the admin-only `GET /api/admin/matches` endpoint,
    which lists every match in the platform for the admin console.

    The endpoints are protected by the JWT bearer token issued by the guest
    or credential authentication flows (Step 12 / Step 13). The current user
    uuid is read from the access token; clients never need to send it
    explicitly.
  version: 0.19.10
  contact:
    name: Paths Games
    url: https://paths.games
  license:
    name: GPL v3
    url: https://www.gnu.org/licenses/gpl-3.0

servers:
  - url: http://localhost:8042
    description: Local development server

tags:
  - name: Matches
    description: Single-player match management

security:
  - bearerAuth: []

paths:
  /api/matches:
    post:
      tags: [Matches]
      summary: Create a new single-player match
      description: |
        Creates a match for the authenticated user. The server validates that
        the story exists, the difficulty belongs to that story, the user is
        not banned and the platform is not under maintenance. It then
        generates a uuid, persists the match (status `CREATED`) and seeds the
        runtime state tables (`gaming_state_locations`,
        `gaming_state_registry`).

        Step 0.19.9 — the optional loadout fields (`characterTemplateUuid`,
        `classUuid`, `traitUuids`, `singlePlayer`) are persisted on the
        `gaming_match` row.
      operationId: createMatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatchCreateRequest'
      responses:
        '201':
          description: Match created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchSummary'
        '400':
          description: Invalid input or story has no locations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid bearer token
        '403':
          description: User is banned or blocked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Story, difficulty or user not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Server is in maintenance mode
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    get:
      tags: [Matches]
      summary: List the matches owned by the authenticated user
      operationId: listUserMatches
      responses:
        '200':
          description: Matches list (newest first)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MatchSummary'
        '401':
          description: Missing or invalid bearer token

  /api/admin/matches:
    get:
      tags: [Matches]
      summary: List every match in the platform (admin)
      description: |
        Admin-only view returning every match created on the platform,
        newest first. Unlike `GET /api/matches` — which is scoped to the
        caller — this endpoint is not filtered by owner. The bearer token
        must belong to a user whose role is `ADMIN`.

        Step 0.19.10 — added so the admin console can list all matches.
      operationId: listAllMatches
      responses:
        '200':
          description: Matches list (newest first)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MatchSummary'
        '401':
          description: Missing or invalid bearer token
        '403':
          description: Caller is not an administrator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/match/{uuidMatch}/info:
    get:
      tags: [Matches]
      summary: Match runtime info (state, registry, options)
      description: |
        Returns the full runtime state of a match owned by the authenticated
        user — match summary, current location, location state, registry
        entries, and the placeholders for upcoming events/choices.

        The active events and choices lists are returned empty in Step 19;
        Step 25 onwards will populate them with the engine output.
      operationId: getMatchInfo
      parameters:
        - $ref: '#/components/parameters/uuidMatch'
      responses:
        '200':
          description: Match runtime info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchInfo'
        '400':
          description: Missing match uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid bearer token
        '404':
          description: Match not found or not owned by the user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:

  parameters:
    uuidMatch:
      name: uuidMatch
      in: path
      required: true
      description: UUID of the match
      schema:
        type: string
        format: uuid

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    MatchCreateRequest:
      type: object
      required: [storyUuid, difficultyUuid]
      properties:
        storyUuid:
          type: string
          format: uuid
          description: UUID of the story to play
        difficultyUuid:
          type: string
          format: uuid
          description: UUID of one of the story's difficulty rows
        name:
          type: string
          nullable: true
          description: Optional human-readable name for the match
        characterTemplateUuid:
          type: string
          format: uuid
          nullable: true
          description: |
            Optional UUID of the character template selected by the creator.
            Persisted on the match (column `character_template_uuid`).
        classUuid:
          type: string
          format: uuid
          nullable: true
          description: |
            Optional UUID of the class selected by the creator.
            Persisted on the match (column `class_uuid`).
        traitUuids:
          type: array
          nullable: true
          items:
            type: string
            format: uuid
          description: |
            Optional list of trait UUIDs selected by the creator. Persisted
            on the match as a comma-separated list (column `trait_uuids`).
        singlePlayer:
          type: integer
          format: int32
          nullable: true
          enum: [0, 1]
          default: 1
          description: |
            Match mode flag — `1` single-player (default), `0` multiplayer.
            Persisted on the match (column `single_player`).
        turnstileToken:
          type: string
          nullable: true
          description: |
            Cloudflare Turnstile challenge token returned by the client widget.
            Validated server-side via the Cloudflare siteverify API.
            May be omitted when `TURNSTILE_SECRET_KEY` is not configured (dev bypass).

    MatchSummary:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
        storyUuid:
          type: string
          format: uuid
        difficultyUuid:
          type: string
          format: uuid
        name:
          type: string
          nullable: true
        status:
          type: string
          enum: [CREATED, RUNNING, PAUSED, ENDED, GAMEOVER]
        currentClock:
          type: integer
          format: int32
        expCost:
          type: integer
          format: int32
        userCreatorUuid:
          type: string
          format: uuid
        tsInsert:
          type: string
          description: ISO-8601 timestamp the match was created at
        singlePlayer:
          type: integer
          format: int32
          nullable: true
          description: Match mode flag persisted at creation (1 single-player, 0 multiplayer)
        characterTemplateUuid:
          type: string
          format: uuid
          nullable: true
          description: Character template selected by the creator
        classUuid:
          type: string
          format: uuid
          nullable: true
          description: Class selected by the creator
        traitUuids:
          type: array
          items:
            type: string
            format: uuid
          description: Trait UUIDs selected by the creator

    LocationState:
      type: object
      properties:
        idLocation:
          type: integer
          format: int64
        uuid:
          type: string
          format: uuid
        flagAlreadyActived:
          type: integer
          format: int32
        clockCounter:
          type: integer
          format: int32
        name:
          type: string
          nullable: true

    RegistryEntry:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
        key:
          type: string
        stringValue:
          type: string
          nullable: true
        intValue:
          type: integer
          format: int32
          nullable: true

    EventOption:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
          enum: [EVENT, CHOICE]

    MatchInfo:
      type: object
      properties:
        match:
          $ref: '#/components/schemas/MatchSummary'
        currentLocationId:
          type: integer
          format: int64
          nullable: true
        currentLocationUuid:
          type: string
          format: uuid
          nullable: true
        currentLocationName:
          type: string
          nullable: true
        locations:
          type: array
          items:
            $ref: '#/components/schemas/LocationState'
        registry:
          type: array
          items:
            $ref: '#/components/schemas/RegistryEntry'
        events:
          type: array
          items:
            $ref: '#/components/schemas/EventOption'
        choices:
          type: array
          items:
            $ref: '#/components/schemas/EventOption'
        locationsActive:
          description: >
            Locations currently occupied by one or more players, each enriched
            with its visual card, the neighbor locations reachable from it (both
            directions) and the events specific to it. Only locations carrying at
            least one player are present.
          type: array
          items:
            $ref: '#/components/schemas/LocationInfo'

    CardInfo:
      type: object
      nullable: true
      properties:
        uuid:
          type: string
          format: uuid
        cardType:
          type: string
          nullable: true
        urlImage:
          type: string
          nullable: true
        alternativeImage:
          type: string
          nullable: true
        awesomeIcon:
          type: string
          nullable: true
        styleMain:
          type: string
          nullable: true
        styleDetail:
          type: string
          nullable: true
        styleImageLittle:
          type: string
          nullable: true
        styleImageMedium:
          type: string
          nullable: true
        styleImageLarge:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        copyrightText:
          type: string
          nullable: true
        linkCopyright:
          type: string
          nullable: true

    LocationNeighborInfo:
      type: object
      properties:
        idLocation:
          description: The other endpoint of the neighbor link (the destination).
          type: integer
          format: int64
        uuid:
          type: string
          format: uuid
          nullable: true
        direction:
          type: string
          nullable: true
        flagBack:
          type: integer
          format: int32
          nullable: true
        energyCost:
          type: integer
          format: int32
          nullable: true
        card:
          $ref: '#/components/schemas/CardInfo'

    EventInfo:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
        type:
          type: string
          nullable: true
        card:
          $ref: '#/components/schemas/CardInfo'

    LocationInfo:
      type: object
      properties:
        idLocation:
          type: integer
          format: int64
        uuid:
          type: string
          format: uuid
          nullable: true
        card:
          $ref: '#/components/schemas/CardInfo'
        neighbors:
          type: array
          items:
            $ref: '#/components/schemas/LocationNeighborInfo'
        events:
          type: array
          items:
            $ref: '#/components/schemas/EventInfo'

    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        timestamp:
          type: integer
          format: int64
