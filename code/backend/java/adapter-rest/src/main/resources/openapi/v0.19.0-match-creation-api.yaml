openapi: 3.0.3
info:
  title: Paths Games — Single-player Match Creation API
  description: |
    OpenAPI specification for **Step 19: Single-player match creation**.

    A *match* is the running instance of a story for a single user. Step 19
    introduces the endpoints required to create a match, list the user's
    matches and retrieve the runtime state needed to render the in-game UI.

    Version 0.19.9 extends the match creation request with the creator
    loadout — character template, class, traits and a single-player flag —
    which is now persisted on the match.

    Version 0.19.10 adds the admin-only `GET /api/admin/matches` endpoint,
    which lists every match in the platform for the admin console.

    The endpoints are protected by the JWT bearer token issued by the guest
    or credential authentication flows (Step 12 / Step 13). The current user
    uuid is read from the access token; clients never need to send it
    explicitly.
  version: 0.19.10
  contact:
    name: Paths Games
    url: https://paths.games
  license:
    name: GPL v3
    url: https://www.gnu.org/licenses/gpl-3.0

servers:
  - url: http://localhost:8042
    description: Local development server

tags:
  - name: Matches
    description: Single-player match management

security:
  - bearerAuth: []

paths:
  /api/matches:
    post:
      tags: [Matches]
      summary: Create a new single-player match
      description: |
        Creates a match for the authenticated user. The server validates that
        the story exists, the difficulty belongs to that story, the user is
        not banned and the platform is not under maintenance. It then
        generates a uuid, persists the match (status `CREATED`) and seeds the
        runtime state tables (`gaming_state_locations`,
        `gaming_state_registry`).

        Step 0.19.9 — the optional loadout fields (`characterTemplateUuid`,
        `classUuid`, `traitUuids`, `singlePlayer`) are persisted on the
        `gaming_match` row.
      operationId: createMatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatchCreateRequest'
      responses:
        '201':
          description: Match created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchSummary'
        '400':
          description: Invalid input or story has no locations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid bearer token
        '403':
          description: User is banned or blocked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Story, difficulty or user not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >-
            v0.32.1 — ACTIVE_MATCH_ALREADY_EXISTS: the caller already owns a
            non-terminal match (CREATED, RUNNING or PAUSED) on this story. Only
            one active match per user and story is allowed; the client can find
            the existing match with GET /api/matches.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Server is in maintenance mode
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    get:
      tags: [Matches]
      summary: List the matches owned by the authenticated user
      operationId: listUserMatches
      responses:
        '200':
          description: Matches list (newest first)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MatchSummary'
        '401':
          description: Missing or invalid bearer token

  /api/admin/matches:
    get:
      tags: [Matches]
      summary: List matches in the platform — paginated (admin)
      description: |
        Admin-only view of the matches created on the platform, newest first.
        Unlike `GET /api/matches` — which is scoped to the caller — this endpoint
        is not filtered by owner. The bearer token must belong to a user whose
        role is `ADMIN`.

        Step 0.19.10 — added so the admin console can list all matches.

        v0.28.1 — the endpoint is now **paginated and filterable** so the admin
        console never reads the whole table:
          * the response is a `PagedMatches` envelope `{ items, nextCursor, limit }`
            (no longer a bare array);
          * pass `?cursor=` with the previous response's `nextCursor` to fetch the
            next page (`nextCursor` is `null` on the last page);
          * optional filters: `status`, `userUuid`, `storyUuid`, `sinceDays`.
        On AWS this is a single DynamoDB Query on the `GSI2` "by type" index; on
        Java/Python it is a keyset query (`ts_insert`, `id`) with `LIMIT`.
      operationId: listAllMatches
      parameters:
        - name: limit
          in: query
          required: false
          description: Page size. Clamped to [1, 200].
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
        - name: cursor
          in: query
          required: false
          description: Opaque token from a previous response's `nextCursor`. Omit for the first page.
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: Exact status filter.
          schema:
            type: string
            enum: [CREATED, RUNNING, PAUSED, ENDED, GAMEOVER]
        - name: userUuid
          in: query
          required: false
          description: Only matches created by this user.
          schema:
            type: string
        - name: storyUuid
          in: query
          required: false
          description: Only matches of this story.
          schema:
            type: string
        - name: sinceDays
          in: query
          required: false
          description: Only matches created within the last N days.
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: One page of matches (newest first)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedMatches'
        '401':
          description: Missing or invalid bearer token
        '403':
          description: Caller is not an administrator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/match/{uuidMatch}/info:
    get:
      tags: [Matches]
      summary: Match runtime info (state, registry, options)
      description: |
        Returns the full runtime state of a match owned by the authenticated
        user — match summary, current location, location state, registry
        entries, and the placeholders for upcoming events/choices.

        The active events and choices lists are returned empty in Step 19;
        Step 25 onwards will populate them with the engine output.
      operationId: getMatchInfo
      parameters:
        - $ref: '#/components/parameters/uuidMatch'
        - name: lang
          in: query
          required: false
          description: Language code used to resolve all card texts (location, neighbor and event cards). Falls back to English when blank or missing.
          schema:
            type: string
            default: en
      responses:
        '200':
          description: Match runtime info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchInfo'
        '400':
          description: Missing match uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid bearer token
        '404':
          description: Match not found or not owned by the user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:

  parameters:
    uuidMatch:
      name: uuidMatch
      in: path
      required: true
      description: UUID of the match
      schema:
        type: string
        format: uuid

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    MatchCreateRequest:
      type: object
      required: [storyUuid, difficultyUuid]
      properties:
        storyUuid:
          type: string
          format: uuid
          description: UUID of the story to play
        difficultyUuid:
          type: string
          format: uuid
          description: UUID of one of the story's difficulty rows
        name:
          type: string
          nullable: true
          description: Optional human-readable name for the match
        characterTemplateUuid:
          type: string
          format: uuid
          nullable: true
          description: |
            Optional UUID of the character template selected by the creator.
            Persisted on the match (column `character_template_uuid`).
        classUuid:
          type: string
          format: uuid
          nullable: true
          description: |
            Optional UUID of the class selected by the creator.
            Persisted on the match (column `class_uuid`).
        traitUuids:
          type: array
          nullable: true
          items:
            type: string
            format: uuid
          description: |
            Optional list of trait UUIDs selected by the creator. Persisted
            on the match as a comma-separated list (column `trait_uuids`).
        singlePlayer:
          type: integer
          format: int32
          nullable: true
          enum: [0, 1]
          default: 1
          description: |
            Match mode flag — `1` single-player (default), `0` multiplayer.
            Persisted on the match (column `single_player`).
        turnstileToken:
          type: string
          nullable: true
          description: |
            Cloudflare Turnstile challenge token returned by the client widget.
            Validated server-side via the Cloudflare siteverify API.
            May be omitted when `TURNSTILE_SECRET_KEY` is not configured (dev bypass).

    MatchSummary:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
        storyUuid:
          type: string
          format: uuid
        difficultyUuid:
          type: string
          format: uuid
        name:
          type: string
          nullable: true
        status:
          type: string
          enum: [CREATED, RUNNING, PAUSED, ENDED, GAMEOVER]
        currentClock:
          type: integer
          format: int32
        expCost:
          type: integer
          format: int32
        userCreatorUuid:
          type: string
          format: uuid
        tsInsert:
          type: string
          description: ISO-8601 timestamp the match was created at
        singlePlayer:
          type: integer
          format: int32
          nullable: true
          description: Match mode flag persisted at creation (1 single-player, 0 multiplayer)
        characterTemplateUuid:
          type: string
          format: uuid
          nullable: true
          description: Character template selected by the creator
        classUuid:
          type: string
          format: uuid
          nullable: true
          description: Class selected by the creator
        traitUuids:
          type: array
          items:
            type: string
            format: uuid
          description: Trait UUIDs selected by the creator

    PagedMatches:
      type: object
      description: |
        v0.28.1 — one page of the admin match list (newest first). Returned by
        `GET /api/admin/matches`.
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MatchSummary'
        nextCursor:
          type: string
          nullable: true
          description: Opaque token for the next page; `null` on the last page. Pass it back as `?cursor=`.
        limit:
          type: integer
          format: int32
          description: Effective (clamped) page size that produced this page.
      required: [items, limit]

    LocationState:
      description: >
        One row of gaming_state_locations. v0.28.6 — on the PLAYER endpoint only
        ALREADY-VISITED locations are returned (visited = character positions ∪
        movement log, the same set GET /api/match/{uuidMatch}/locations returns);
        the list is empty until a character joins the match. The ADMIN endpoint
        (GET /api/admin/matches/{uuidMatch}/info) is the exception: it returns
        every story location so the console can render the full runtime table.
        `flagAlreadyActived` is NOT a visited flag — it tracks the location's
        entry-event state.
      type: object
      properties:
        idLocation:
          type: integer
          format: int64
        uuid:
          type: string
          format: uuid
        flagAlreadyActived:
          type: integer
          format: int32
        clockCounter:
          type: integer
          format: int32

    RegistryEntry:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
        key:
          type: string
        stringValue:
          type: string
          nullable: true
        intValue:
          type: integer
          format: int32
          nullable: true

    EventOption:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
          enum: [EVENT, CHOICE]

    MatchInfo:
      type: object
      properties:
        match:
          $ref: '#/components/schemas/MatchSummary'
        currentLocationId:
          type: integer
          format: int64
          nullable: true
        currentLocationUuid:
          type: string
          format: uuid
          nullable: true
        locations:
          description: >
            v0.28.6 — the ALREADY-VISITED locations of the match only. The admin
            info endpoint returns every story location instead (no visited filter).
            The synthetic `name` field was removed: resolve a location's title from
            its card (LocationInfo.card, LocationNeighborInfo.cardLocationFrom /
            cardLocationTo, or GET /locations).
          type: array
          items:
            $ref: '#/components/schemas/LocationState'
        registry:
          type: array
          items:
            $ref: '#/components/schemas/RegistryEntry'
        events:
          type: array
          items:
            $ref: '#/components/schemas/EventOption'
        choices:
          type: array
          items:
            $ref: '#/components/schemas/EventOption'
        locationsActive:
          description: >
            Locations currently occupied by one or more players, each enriched
            with its visual card, the neighbor locations reachable from it (both
            directions) and the events specific to it. Only locations carrying at
            least one player are present.
          type: array
          items:
            $ref: '#/components/schemas/LocationInfo'

    CardInfo:
      type: object
      nullable: true
      properties:
        uuid:
          type: string
          format: uuid
        cardType:
          type: string
          nullable: true
        urlImage:
          type: string
          nullable: true
        alternativeImage:
          type: string
          nullable: true
        awesomeIcon:
          type: string
          nullable: true
        styleMain:
          type: string
          nullable: true
        styleDetail:
          type: string
          nullable: true
        styleImageLittle:
          type: string
          nullable: true
        styleImageMedium:
          type: string
          nullable: true
        styleImageLarge:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        copyrightText:
          type: string
          nullable: true
        linkCopyright:
          type: string
          nullable: true

    LocationNeighborInfo:
      type: object
      properties:
        idLocation:
          description: The other endpoint of the neighbor link (the destination).
          type: integer
          format: int64
        uuid:
          type: string
          format: uuid
          nullable: true
        direction:
          type: string
          nullable: true
        flagBack:
          type: integer
          format: int32
          nullable: true
        energyCost:
          type: integer
          format: int32
          nullable: true
        card:
          allOf:
            - $ref: '#/components/schemas/CardInfo'
          description: >
            Resolved neighbor card: the authored LINK (movement) card when set,
            otherwise a fallback to the destination LOCATION's card. Fog of war
            (v0.28.6): the LOCATION fallback is null until the destination has
            been visited; an authored link card is always shown.
          nullable: true
        secureParam:
          type: integer
          nullable: true
          description: "Safety parameter of the destination location: positive = safe (full recovery), zero or negative = unsafe (only difficulty.energy recovered)"
        idLocationFrom:
          description: The `from` endpoint of the neighbor edge (raw orientation).
          type: integer
          format: int64
          nullable: true
        idLocationTo:
          description: The `to` endpoint of the neighbor edge (raw orientation). When the active player stands on this location, clients show `cardBack` instead of `card`.
          type: integer
          format: int64
          nullable: true
        cardBack:
          description: "Optional resolved \"return\" card, shown when the player traverses the edge from the locationTo side. Falls back to `card` when the link defines no idCardBack."
          allOf:
            - $ref: '#/components/schemas/CardInfo'
        cardLocationFrom:
          description: >
            v0.28.6 — resolved card of the LOCATION at `idLocationFrom`. Distinct
            from `card` (the authored LINK/movement card) and `cardBack` (the
            return LINK card). Fog of war: null until that location has been
            visited; the gating applies identically on the admin endpoint. The
            active location is always visited, so the endpoint matching it always
            resolves — the move DESTINATION is `cardLocationFrom` when the player
            stands on `idLocationTo`, and `cardLocationTo` otherwise.
          allOf:
            - $ref: '#/components/schemas/CardInfo'
          nullable: true
        cardLocationTo:
          description: >
            v0.28.6 — resolved card of the LOCATION at `idLocationTo`, gated on
            that location's own visited flag. See `cardLocationFrom`.
          allOf:
            - $ref: '#/components/schemas/CardInfo'
          nullable: true
        available:
          description: >
            Whether the reference character can take this path right now. Same verdict
            POST /api/gameplay/{id_game}/action/move enforces, from the same check
            procedure — the board can grey out the path instead of letting the player
            discover it by being rejected.
          type: boolean
        reason:
          description: >
            When `available` is false, the error code the move endpoint would answer with;
            null otherwise. Mirrors EventInfo.reason for actions.
          type: string
          nullable: true
          enum:
            - CHARACTER_CANNOT_ACT
            - MATCH_NOT_RUNNING
            - COMA
            - SLEEPING
            - NOT_A_NEIGHBOR
            - MOVEMENT_CONDITION_NOT_MET
            - OVERWEIGHT
            - INSUFFICIENT_ENERGY
            - LOCATION_FULL

    EventInfo:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
        type:
          type: string
          nullable: true
          enum: [AUTOMATIC, FIRST, NORMAL, ONCE]
        endGame:
          description: True when this event is the story's end-game event.
          type: boolean
        card:
          $ref: '#/components/schemas/CardInfo'
        available:
          description: |
            Step 29 — whether the player can trigger this event right now. It is the verdict of
            the same check procedure that `POST /api/gameplay/{uuid}/action/execute-event`
            enforces, so an event shown as available cannot then be refused by that endpoint.
          type: boolean
        reason:
          description: |
            Step 29 — why not, as the error code `execute-event` would return: one of
            `CHARACTER_CANNOT_ACT`, `SLEEPING`, `COMA`, `EVENT_NOT_EXECUTABLE_TYPE`,
            `ONCE_ALREADY_CONSUMED`,
            `WRONG_LOCATION`, `NOT_ENOUGH_ENERGY`, `NOT_ENOUGH_COINS`,
            `REGISTRY_CONDITION_NOT_MET`, `WEATHER_CONDITION_NOT_MET`,
            `ITEM_CONDITION_NOT_MET`, `CLASS_CONDITION_NOT_MET`. Null when `available` is true.
          type: string
          nullable: true
          example: NOT_ENOUGH_ENERGY
        energy:
          description: |
            The energy the event costs to trigger (`costEnery`); 0 when it is free. The board
            renders the cost on the action without a second call.
          type: integer
          example: 1

    LocationInfo:
      type: object
      properties:
        idLocation:
          type: integer
          format: int64
        uuid:
          type: string
          format: uuid
          nullable: true
        idCard:
          type: integer
          nullable: true
          description: "Logical reference to the location's visual card (list_cards id); the resolved card is returned in `card`."
        card:
          $ref: '#/components/schemas/CardInfo'
        secureParam:
          type: integer
          nullable: true
          description: "Safety parameter: positive = safe location (full recovery), zero or negative = unsafe (only difficulty.energy recovered)"
        neighbors:
          type: array
          items:
            $ref: '#/components/schemas/LocationNeighborInfo'
        events:
          type: array
          items:
            $ref: '#/components/schemas/EventInfo'

    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        timestamp:
          type: integer
          format: int64
