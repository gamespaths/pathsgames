openapi: 3.0.3
info:
  title: Paths Games — Missions API
  description: |
    Step 37 — missions become playable.

    `list_missions` and `list_missions_steps` have existed since `V0.10.4`, but nothing read
    them: a story could author a mission and no match would ever notice. v0.37.0 gives them an
    engine, two endpoints and a place on `/info`.

    ## A mission is a projection of the registry

    There is no operator column on a mission and no state table of its own. Every condition is
    read through the Step 36 `RegistryService` with `"="`, which on a single-valued key means
    equality and on a multi-valued (set) key means CONTAINED IN. The comparison is the same one
    events use — trimmed and case-folded — because it is literally the same code.

    ## The condition columns

    `condition_value_from` and `condition_value_to` are gone. In their place:

    - **`condition_value`** — one value.
    - **`condition_values`** — a PIPE-separated list (`a|b|c`). Each segment is trimmed and
      empty segments are dropped. It is an **AND**: on a set key every listed value must be
      present, not just one.

    When both columns hold something, `condition_values` **wins**. That is not a validation
    error; it is the documented precedence.

    A row whose `condition_key` is blank is **invalid**: it never activates, progresses or
    completes, and all three backends ignore it silently. This is the exact opposite of the
    registry's own "blank key = no condition" rule, and deliberately so — an unfinished mission
    must not open itself. `react-admin` refuses to save such a row and story validation reports
    it as `R10_MISSION_CONDITION`.

    ## The status machine

    | Transition | What causes it |
    |---|---|
    | → `AVAILABLE` | the `list_missions` condition is satisfied |
    | → `ACTIVE` | the FIRST `list_missions_steps` condition is satisfied |
    | → `COMPLETED` | the LAST step condition is satisfied |
    | → `FAILED` | the story ENDS while the mission is still open |

    A single-step mission goes `AVAILABLE` → `COMPLETED` directly, skipping `ACTIVE`. A mission
    with no steps at all completes on its own condition. An **intermediate** step closing does
    NOT move the status: a three-step mission stays `ACTIVE` when its second step closes, and
    only `stepReached` moves — which is why the persisted state is (status + step reached) and
    not status alone.

    Steps are strictly sequential by their `step` integer, but may be **satisfied out of
    order**: on every registry write the engine re-evaluates forward from the step reached,
    closing each one already satisfied and stopping at the first that is not. One write can
    close several steps and the mission with them.

    Nothing is reversible. Once a status or a step is reached it is never lost, even if the
    registry value that produced it is later taken away.

    ## Completion events

    `list_missions_steps.id_event_completed` runs when THAT step closes, not only at the end;
    `list_missions.id_event_completed` runs when the mission completes. Those events may write
    the registry and so complete another mission: the cascade is accepted, and capped by the
    same `MAX_ENTRY_DEPTH = 8` that stops a runaway arrival chain.

    ## What is listed

    A mission the match has never reached is not returned at all — not as `LOCKED`, not as an
    empty shell. Listing it would spoil it. `?status=` filters within the missions already
    reached.

    Missions are **match-scoped**, like the registry itself, not character-scoped.

    ## Where they are served

    - `GET /api/match/{uuidMatch}/missions` — the list, optionally filtered by status.
    - `GET /api/match/{uuidMatch}/missions/{uuidMission}` — one mission with all its steps.
    - `missions[]` on `GET /api/match/{uuidMatch}/info` — the same deliberate duplication the
      registry already gets, so the board renders missions with no second request.

    Both endpoints are **owner-only** and 404-masked the same way the registry endpoints are: a
    match somebody else owns is indistinguishable from one that does not exist, and so is a
    mission this match has not reached.
