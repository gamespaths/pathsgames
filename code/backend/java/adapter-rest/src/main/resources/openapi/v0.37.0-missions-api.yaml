servers:
  - url: http://localhost:8042
    description: Development (dev profile)
  - url: http://localhost:8080
    description: Production (prod profile)

paths:
  /api/match/{uuidMatch}/missions:
    get:
      tags: [Missions]
      summary: The missions this match has reached
      operationId: getMatchMissions
      security:
        - bearerAuth: []
      parameters:
        - name: uuidMatch
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: status
          in: query
          required: false
          description: AVAILABLE, ACTIVE, COMPLETED or FAILED. Read case-insensitively.
          schema:
            type: string
            enum: [AVAILABLE, ACTIVE, COMPLETED, FAILED]
        - name: lang
          in: query
          required: false
          schema: { type: string, default: en }
      responses:
        '200':
          description: The missions, in the order the story authored them.
          content:
            application/json:
              schema:
                type: object
                properties:
                  missions:
                    type: array
                    items: { $ref: '#/components/schemas/Mission' }
        '400':
          description: INVALID_INPUT — the match uuid is blank.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: UNAUTHENTICATED — no identity on the request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: MATCH_NOT_FOUND — unknown match, or one the caller does not own.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/match/{uuidMatch}/missions/{uuidMission}:
    get:
      tags: [Missions]
      summary: One mission with all its steps
      operationId: getMatchMission
      security:
        - bearerAuth: []
      parameters:
        - name: uuidMatch
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: uuidMission
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: lang
          in: query
          required: false
          schema: { type: string, default: en }
      responses:
        '200':
          description: The mission.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Mission' }
        '400':
          description: INVALID_INPUT — a blank uuid.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: UNAUTHENTICATED — no identity on the request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: >-
            MATCH_NOT_FOUND — unknown match, a match the caller does not own, or a mission this
            match has not reached. The three are deliberately indistinguishable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Mission:
      type: object
      properties:
        uuid: { type: string, format: uuid }
        name:
          type: string
          nullable: true
          description: Resolved from id_text_name in the requested language, falling back to en.
        description: { type: string, nullable: true }
        status:
          type: string
          enum: [AVAILABLE, ACTIVE, COMPLETED, FAILED]
        stepReached:
          type: integer
          nullable: true
          description: The `step` number of the last step closed; null while none has been.
        stepsTotal: { type: integer }
        idCard: { type: integer, nullable: true }
        card:
          nullable: true
          description: The resolved visual card, as everywhere else in the match payloads.
          type: object
        steps:
          type: array
          items: { $ref: '#/components/schemas/MissionStep' }

    MissionStep:
      type: object
      properties:
        uuid: { type: string, format: uuid }
        step:
          type: integer
          description: The authored position. Steps are returned in this order.
        name: { type: string, nullable: true }
        description: { type: string, nullable: true }
        idCard: { type: integer, nullable: true }
        card: { type: object, nullable: true }
        done:
          type: boolean
          description: >-
            True for every step up to and including the one reached; a COMPLETED mission
            reports all of them done.

    Error:
      type: object
      properties:
        error: { type: string }
        message: { type: string }
        timestamp: { type: integer, format: int64 }
