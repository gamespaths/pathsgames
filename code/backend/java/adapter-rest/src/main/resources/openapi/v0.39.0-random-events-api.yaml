openapi: 3.0.3
info:
  title: Paths Games — Random Events API
  description: |
    Step 39 — global random events fire at time-start.

    `list_global_random_events` has existed since V0.10.4; v0.39.0 gives it an engine. At every
    time-start, **after the weather**, at most one row fires. Never at clock 0, only on RUNNING
    matches, never on an arrival or an action.

    ## The pick

    `probability` is an **absolute percentage** (integer 0..100). Eligible rows: the registry
    condition holds (`conditionKey` blank = no condition; `registryValueOperatorCondition`
    `=` `!=` `>` `<`, null = `=`), `probability > 0`, the event exists, owns no choices and is
    not a spent `ONCE` event. They are ordered by `probability` DESC then `id` ASC; `total` is
    their sum; a roll in `[0, max(100, total))` walks the cumulative ranges. `roll >= total`
    means nothing fires. So with `total <= 100` each row fires with exactly its own percentage;
    above 100 every row is scaled down proportionally and one row always fires.

    Seed: `(rngSeed ?? idStory) + clock + 1_000_003`, reproducible per backend (Java and
    Python/AWS use different generators).

    ## What it does

    The event runs with **no actor**, party-wide: `target = ALL` reaches every character of the
    match, `ONLY_ONE` nobody, `targetClass` narrows. It writes one timeline row of type
    `RANDOM_EVENT` and rides on the sleep answer inside `counterZero[]` with
    `trigger: RANDOM_EVENT`, `idLocation: null` and `visibility: FULL`.

    ## Validation `R11_RANDOM_EVENT`

    Import fails (CRUD stays lenient, `validate` reports) when `probability` is outside 0..100,
    `idEvent` is missing, the event owns choices, the event has an effect with `idWeather`, or
    only one of `conditionKey` / `conditionValue` is set. `validate` also returns a **warning**
    (`warnings[]`, never an error) when the probabilities sum past 100.
