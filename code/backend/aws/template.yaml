AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: "Paths Games - Backend Serverless (AWS SAM)"

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, test, alpha, beta, prod]
    Description: "Deploy environment. Suffix of every resource name, API stage and Lambda ENV; the Environment tag is mapped from it (prod -> production)."
  Version:
    Type: String
    Default: "0.38.1"
    Description: "Project version, applied as the `version` tag on every resource. Source: VERSION in the root .env; code/scripts/dev/bump-version.sh keeps this default in sync."
  JwtSecret:
    Type: String
    NoEcho: true
    Default: PathsGamesDevSecret2026_MustBeAtLeast32Chars!
    Description: "Secret key for JWT signing and verification. v0.41.0: outside dev/test the committed default makes every handler answer 500 MISCONFIGURED."
  TurnstileSecretKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: "Cloudflare Turnstile secret key. Leave empty to disable validation (dev bypass)."
  TurnstileBypassToken:
    Type: String
    NoEcho: true
    Default: ""
    Description: "Optional Robot-test bypass token. When non-empty, an incoming turnstileToken equal to this value skips Cloudflare verification. Leave empty in prod."
  AllowMockAccess:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: "Enable MOCK_ACCESS_/MOCK_REFRESH_ tokens (dev convenience). v0.41.0: default false; the dev/test deploy script passes true."
  # Step 41 — fixed-window limits per source IP on POST /api/auth/guest and POST /api/matches,
  # plus (v0.41.0) matches per guest per day; "0" disables a bucket (Robot and stress runs).
  RateLimitGuestPerIp:
    Type: String
    Default: "20"
    Description: "Max new guest sessions per source IP per window. 0 = disabled."
  RateLimitMatchPerIp:
    Type: String
    Default: "20"
    Description: "Max new matches per source IP per window. 0 = disabled."
  RateLimitWindowSeconds:
    Type: String
    Default: "3600"
    Description: "Length of the rate-limit window, in seconds."
  RateLimitMatchPerGuest:
    Type: String
    Default: "10"
    Description: "v0.41.0 - max new matches per guest (user uuid) per guest window. 0 = disabled."
  RateLimitMatchPerGuestWindowSeconds:
    Type: String
    Default: "86400"
    Description: "v0.41.0 - length of the per-guest window, in seconds."
  # v0.41.0 — the daily job deleting the guests idle for N days that created no match.
  GuestCleanupEnabled:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: "v0.41.0 - run the daily idle-guest cleanup (GuestCleanupFunction)."
  GuestCleanupAgeDays:
    Type: String
    Default: "60"
    Description: "v0.41.0 - days since the last access after which a match-less guest is deleted."
  GuestCleanupMaxPerRun:
    Type: String
    Default: "500"
    Description: "v0.41.0 - at most this many guests per run (and per withoutMatches=true admin call); the rest goes the next day."
  GuestCleanupSchedule:
    Type: String
    Default: "cron(42 0 * * ? *)"
    Description: "v0.41.0 - EventBridge Scheduler expression of the cleanup, evaluated in UTC."
  # v0.39.1 — robottest guests/matches get a DynamoDB ttl, honoured only on dev/test stacks.
  RobotTestDataTtlHours:
    Type: String
    Default: "0"
    Description: "Hours after which Robot test guests and matches expire via TTL. 0 = disabled."
  CsrfEnforced:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: "Require the csrfToken issued at login back as X-CSRF-TOKEN on POST /api/matches."
  SeedBcryptHash:
    Type: String
    NoEcho: true
    Default: ""
    Description: "BCrypt hash for seed users (dev-only). Pass at deploy time, do not store in code."
  CustomDomainName:
    Type: String
    Default: ""
    Description: "Optional. Custom public domain (e.g., api-dev.paths.games)"
  CustomDomainCertificateArn:
    Type: String
    Default: ""
    Description: "Optional. ARN of the ACM certificate for the custom domain"
  CustomDomainHostedZoneId:
    Type: String
    Default: ""
    Description: "Optional. Global Route53 Hosted Zone ID for automatic Alias record"
  CorsAllowOrigins:
    Type: CommaDelimitedList
    Default: "http://localhost,http://localhost:3000,http://localhost:5173,http://localhost:5174,http://localhost:8042,http://localhost:8080,http://127.0.0.1,http://127.0.0.1:3000,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:8042,http://127.0.0.1:8080,http://127.0.0.1:5500,https://paths.games,https://www.paths.games,https://test.paths.games"
    Description: "Comma-separated list of CORS allowed origins (e.g. https://app.paths.games,http://localhost:5173,http://localhost:5174)"
  AdminIpWhitelist:
    Type: String
    Default: ""
    Description: "Comma-separated list of IPs allowed to call /api/admin/** endpoints. Empty = what AdminIpEmptyMeans says (default: nobody). Example: 1.2.3.4,5.6.7.8"
  AdminIpEmptyMeans:
    Type: String
    Default: nobody
    AllowedValues: [nobody, everybody]
    Description: "v0.41.0 - meaning of an empty AdminIpWhitelist on the authorizer and every admin handler: nobody (admin API closed) or everybody."
  StoryCacheTtlSeconds:
    Type: String
    Default: "3600"
    Description: "v0.37.5 - seconds a Lambda container keeps a STORY item in memory (0 = no cache). A SYSTEM#cache stamp already invalidates on every write; POST /api/admin/cache/flush invalidates everywhere."
  WebsiteBucket:
    Type: String
    Default: ""
    Description: "v0.37.6 - S3 bucket of the game website (test.paths.games). POST /api/admin/stories/catalog writes data/stories-{lang}.json there; empty = endpoint answers 503."
  WebsiteCloudFrontId:
    Type: String
    Default: ""
    Description: "v0.37.6 - CloudFront distribution id of the website, invalidated (/data/stories-*.json only) after a catalog write. Empty = no invalidation."
  CatalogLangs:
    Type: String
    Default: "en,it"
    Description: "v0.37.6 - languages written by the static catalog export."
  TableBillingMode:
    Type: String
    Default: PAY_PER_REQUEST
    AllowedValues: [PAY_PER_REQUEST, PROVISIONED]
    Description: "v0.37.5 - PROVISIONED keeps a dev table inside the always-free 25 RCU/WCU (table + GSIs share them); prod stays PAY_PER_REQUEST."
  TableReadCapacity:
    Type: Number
    Default: 10
    Description: "Table RCU when PROVISIONED (ignored otherwise)."
  TableWriteCapacity:
    Type: Number
    Default: 10
    Description: "Table WCU when PROVISIONED (ignored otherwise)."
  GsiReadCapacity:
    Type: Number
    Default: 5
    Description: "RCU of each GSI when PROVISIONED (ignored otherwise)."
  GsiWriteCapacity:
    Type: Number
    Default: 5
    Description: "WCU of each GSI when PROVISIONED (ignored otherwise)."
  LambdaSystemLogLevel:
    Type: String
    Default: WARN
    AllowedValues: [DEBUG, INFO, WARN]
    Description: "v0.37.5 - WARN drops the START/END/REPORT lines of every invocation (CloudWatch ingestion); INFO brings the REPORT back for memory tuning."
  # v0.42.0 — public stages (alpha, beta, prod) only: API throttling, alarms and the monthly budget.
  ApiThrottleRate:
    Type: Number
    Default: 50
    Description: "v0.42.0 - steady requests per second of the public API stage (public stages only)."
  ApiThrottleBurst:
    Type: Number
    Default: 100
    Description: "v0.42.0 - burst requests of the public API stage (public stages only)."
  AdminApiThrottleRate:
    Type: Number
    Default: 5
    Description: "v0.42.0 - steady requests per second of the admin API stage (public stages only)."
  AdminApiThrottleBurst:
    Type: Number
    Default: 10
    Description: "v0.42.0 - burst requests of the admin API stage (public stages only)."
  AlarmEmail:
    Type: String
    Default: ""
    Description: "v0.42.0 - email of the SNS alarm topic. Empty = no topic, no subscription, no alarm."
  CreateBudget:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: "v0.42.0 - create the monthly AWS budget filtered on the Project tag (true only for alpha)."
  BudgetLimit:
    Type: Number
    Default: 10
    Description: "v0.42.0 - monthly budget limit, in USD."
  BudgetEmail:
    Type: String
    Default: ""
    Description: "v0.42.0 - email warned at 80% actual and 100% forecast of the budget. Empty = no notification."

Mappings:
  # Environment tag value per deploy environment. The parameter keeps `prod` because resource
  # names, the API stage and the Lambda ENV guards key on it; only the tag says `production`.
  # Project tag = Paths.games.aws.<Name>.serverless.
  EnvironmentTags:
    dev:
      Name: dev
      Project: Paths.games.aws.dev.serverless
    test:
      Name: test
      Project: Paths.games.aws.test.serverless
    alpha:
      Name: alpha
      Project: Paths.games.aws.alpha.serverless
    beta:
      Name: beta
      Project: Paths.games.aws.beta.serverless
    prod:
      Name: production
      Project: Paths.games.aws.production.serverless

Conditions:
  IsProvisioned: !Equals [!Ref TableBillingMode, PROVISIONED]
  HasCustomDomain: !Not [!Equals [!Ref CustomDomainName, ""]]
  HasCustomDomainAndHostedZone: !And
    - !Not [!Equals [!Ref CustomDomainName, ""]]
    - !Not [!Equals [!Ref CustomDomainHostedZoneId, ""]]
  # v0.42.0 — hardening of the public stages; dev and test never get any of it.
  IsPublicStage: !Or
    - !Equals [!Ref Environment, alpha]
    - !Equals [!Ref Environment, beta]
    - !Equals [!Ref Environment, prod]
  HasAlarms: !And
    - !Condition IsPublicStage
    - !Not [!Equals [!Ref AlarmEmail, ""]]
  HasBudget: !And
    - !Condition IsPublicStage
    - !Equals [!Ref CreateBudget, "true"]
  HasBudgetEmail: !Not [!Equals [!Ref BudgetEmail, ""]]

Resources:
  # DynamoDB Table (Single Table Design)
  PathsGamesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "PathsGamesBackend-${Environment}"
      # v0.42.0 — public stages: point-in-time recovery and deletion protection (restore runbook: code/scripts/alpha/README.md).
      PointInTimeRecoverySpecification: !If
        - IsPublicStage
        - PointInTimeRecoveryEnabled: true
        - !Ref AWS::NoValue
      DeletionProtectionEnabled: !If [IsPublicStage, true, false]
      Tags:
        - Key: Name
          Value: !Sub "PathsGamesBackend-${Environment}"
        - Key: CostCenter
          Value: Paths.games
        - Key: Environment
          Value: !FindInMap [EnvironmentTags, !Ref Environment, Name]
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Owner
          Value: AlNao
        - Key: Project
          Value: !FindInMap [EnvironmentTags, !Ref Environment, Project]
        - Key: version
          Value: !Ref Version
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1_PK
          AttributeType: S
        - AttributeName: GSI1_SK
          AttributeType: S
        - AttributeName: GSI2_PK
          AttributeType: S
        - AttributeName: GSI2_SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      # v0.37.5 — PROVISIONED (dev) stays inside the always-free 25 RCU/WCU; prod is on-demand.
      BillingMode: !Ref TableBillingMode
      # v0.37.7 — the rate-limit counters (RATELIMIT#…) carry a `ttl` so they expire on their own.
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      ProvisionedThroughput: !If
        - IsProvisioned
        - ReadCapacityUnits: !Ref TableReadCapacity
          WriteCapacityUnits: !Ref TableWriteCapacity
        - !Ref AWS::NoValue
      GlobalSecondaryIndexes:
        # v0.37.5 — both indexes are INCLUDE projections: a match's state and a story's
        # 300 KB of texts are never replicated. GSI1 = "by owner" (USER_MATCHES#<uuid>,
        # GUEST_TOKEN#<token>), GSI2 = "by type" (MATCH, STORY_LIST, GUEST_LIST).
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1_PK
              KeyType: HASH
            - AttributeName: GSI1_SK
              KeyType: RANGE
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes:
              # match summary (_summary_from_item)
              - uuid
              - storyUuid
              - difficultyUuid
              - name
              - status
              - currentClock
              - expCost
              - rngSeed
              - userCreatorUuid
              - tsInsert
              - singlePlayer
              - characterTemplateUuid
              - classUuid
              - traitUuids
              # guest resume (auth/handler.py resume_guest)
              - username
              - role
              - token_version
              - guest_token
          ProvisionedThroughput: !If
            - IsProvisioned
            - ReadCapacityUnits: !Ref GsiReadCapacity
              WriteCapacityUnits: !Ref GsiWriteCapacity
            - !Ref AWS::NoValue
        # GSI2_SK="{tsInsert:020d}#{uuid}" on matches: the admin list is one newest-first
        # Query (sinceDays = SK range). Stories and guests carry ONE ``summary`` map with
        # everything their list needs — DynamoDB caps NonKeyAttributes at 20 per index.
        - IndexName: GSI2
          KeySchema:
            - AttributeName: GSI2_PK
              KeyType: HASH
            - AttributeName: GSI2_SK
              KeyType: RANGE
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes:
              - uuid
              - storyUuid
              - difficultyUuid
              - name
              - status
              - currentClock
              - expCost
              - rngSeed
              - userCreatorUuid
              - tsInsert
              - singlePlayer
              - characterTemplateUuid
              - classUuid
              - traitUuids
              - summary
          ProvisionedThroughput: !If
            - IsProvisioned
            - ReadCapacityUnits: !Ref GsiReadCapacity
              WriteCapacityUnits: !Ref GsiWriteCapacity
            - !Ref AWS::NoValue

  # HTTP API (API Gateway v2) — public/player surface.
  # v0.37.7 — a plain AWS::ApiGatewayV2::Api, NOT AWS::Serverless::HttpApi: SAM renders the
  # latter as an Api with an OpenAPI `Body` (paths: {}), and every update of that body
  # (a CORS or tag change) re-imports the definition and DELETES the routes the nested
  # modules created — the stage then keeps serving its last snapshot, silently stale.
  PathsGamesApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "pathsgames-${Environment}"
      ProtocolType: HTTP
      Tags:
        Name: !Sub "pathsgames-${Environment}"
        CostCenter: Paths.games
        Environment: !FindInMap [EnvironmentTags, !Ref Environment, Name]
        ManagedBy: CloudFormation
        Owner: AlNao
        Project: !FindInMap [EnvironmentTags, !Ref Environment, Project]
        version: !Ref Version
      CorsConfiguration:
        AllowMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
        AllowOrigins: !Ref CorsAllowOrigins
        # X-CSRF-TOKEN rides on POST /api/matches; without it here the browser's preflight
        # fails and the game never reaches the API. Retry-After is read on a 429.
        AllowHeaders: [Content-Type, Authorization, Cookie, X-CSRF-TOKEN]
        ExposeHeaders: [Retry-After]
        AllowCredentials: true

  PathsGamesApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref PathsGamesApi
      StageName: !Ref Environment
      AutoDeploy: true
      # v0.42.0 — throttling on public stages only.
      DefaultRouteSettings: !If
        - IsPublicStage
        - ThrottlingRateLimit: !Ref ApiThrottleRate
          ThrottlingBurstLimit: !Ref ApiThrottleBurst
        - !Ref AWS::NoValue
      Tags:
        Name: !Sub "pathsgames-${Environment}-ApiStage"
        CostCenter: Paths.games
        Environment: !FindInMap [EnvironmentTags, !Ref Environment, Name]
        ManagedBy: CloudFormation
        Owner: AlNao
        Project: !FindInMap [EnvironmentTags, !Ref Environment, Project]
        version: !Ref Version

  # Dedicated ADMIN HTTP API — serves ONLY /api/admin/** routes and is gated by an
  # IP-allow-list Lambda authorizer (the AWS-side equivalent of the 8044 admin port).
  PathsGamesAdminApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "pathsgames-${Environment}-admin"
      ProtocolType: HTTP
      Tags:
        Name: !Sub "pathsgames-${Environment}-admin"
        CostCenter: Paths.games
        Environment: !FindInMap [EnvironmentTags, !Ref Environment, Name]
        ManagedBy: CloudFormation
        Owner: AlNao
        Project: !FindInMap [EnvironmentTags, !Ref Environment, Project]
        version: !Ref Version
      CorsConfiguration:
        AllowMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
        AllowOrigins: !Ref CorsAllowOrigins
        AllowHeaders: [Content-Type, Authorization, Cookie]
        AllowCredentials: true

  PathsGamesAdminApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref PathsGamesAdminApi
      StageName: !Ref Environment
      AutoDeploy: true
      # v0.42.0 — throttling on public stages only.
      DefaultRouteSettings: !If
        - IsPublicStage
        - ThrottlingRateLimit: !Ref AdminApiThrottleRate
          ThrottlingBurstLimit: !Ref AdminApiThrottleBurst
        - !Ref AWS::NoValue
      Tags:
        Name: !Sub "pathsgames-${Environment}-AdminApiStage"
        CostCenter: Paths.games
        Environment: !FindInMap [EnvironmentTags, !Ref Environment, Name]
        ManagedBy: CloudFormation
        Owner: AlNao
        Project: !FindInMap [EnvironmentTags, !Ref Environment, Project]
        version: !Ref Version

  AdminIpAuthorizerLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/pathsgames-${Environment}-AdminIpAuthorizer"
      RetentionInDays: 14
      Tags:
        - Key: Name
          Value: !Sub "/aws/lambda/pathsgames-${Environment}-AdminIpAuthorizer"
        - Key: CostCenter
          Value: Paths.games
        - Key: Environment
          Value: !FindInMap [EnvironmentTags, !Ref Environment, Name]
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Owner
          Value: AlNao
        - Key: Project
          Value: !FindInMap [EnvironmentTags, !Ref Environment, Project]
        - Key: version
          Value: !Ref Version

  AdminIpAuthorizerFunction:
    Type: AWS::Serverless::Function
    DependsOn: AdminIpAuthorizerLogGroup
    Properties:
      FunctionName: !Sub "pathsgames-${Environment}-AdminIpAuthorizer"
      Runtime: python3.13
      Handler: authorizer.handler.lambda_handler
      Architectures: [arm64]
      LoggingConfig:
        LogFormat: JSON
        SystemLogLevel: !Ref LambdaSystemLogLevel
        ApplicationLogLevel: INFO
      Timeout: 10
      MemorySize: 128
      CodeUri: lambda/
      Tags:
        Name: !Sub "pathsgames-${Environment}-AdminIpAuthorizer"
        CostCenter: Paths.games
        Environment: !FindInMap [EnvironmentTags, !Ref Environment, Name]
        ManagedBy: CloudFormation
        Owner: AlNao
        Project: !FindInMap [EnvironmentTags, !Ref Environment, Project]
        version: !Ref Version
      Environment:
        Variables:
          ADMIN_IP_WHITELIST: !Ref AdminIpWhitelist
          ADMIN_IP_EMPTY_MEANS: !Ref AdminIpEmptyMeans

  # REQUEST authorizer (simple responses). No IdentitySource + TTL 0 → invoked on every
  # request so a changed allow-list takes effect immediately and per-IP caching can't leak.
  AdminIpAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref PathsGamesAdminApi
      Name: AdminIpAuthorizer
      AuthorizerType: REQUEST
      AuthorizerPayloadFormatVersion: "2.0"
      EnableSimpleResponses: true
      AuthorizerResultTtlInSeconds: 0
      # No IdentitySource → the authorizer runs on EVERY admin request (no caching),
      # so the source IP is always checked and allow-list changes take effect at once.
      AuthorizerUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AdminIpAuthorizerFunction.Arn}/invocations"

  AdminIpAuthorizerPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref AdminIpAuthorizerFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${PathsGamesAdminApi}/*"

  PathsGamesApiCustomDomain:
    Type: AWS::ApiGatewayV2::DomainName
    Condition: HasCustomDomain
    Properties:
      DomainName: !Ref CustomDomainName
      DomainNameConfigurations:
        - CertificateArn: !Ref CustomDomainCertificateArn
          EndpointType: REGIONAL
      Tags:
        Name: !Ref CustomDomainName
        CostCenter: Paths.games
        Environment: !FindInMap [EnvironmentTags, !Ref Environment, Name]
        ManagedBy: CloudFormation
        Owner: AlNao
        Project: !FindInMap [EnvironmentTags, !Ref Environment, Project]
        version: !Ref Version

  PathsGamesApiMapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    Condition: HasCustomDomain
    Properties:
      ApiId: !Ref PathsGamesApi
      DomainName: !Ref CustomDomainName
      Stage: !Ref Environment
    DependsOn:
      - PathsGamesApiCustomDomain
      - PathsGamesApi
      - PathsGamesApiStage

  PathsGamesApiDnsRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasCustomDomainAndHostedZone
    Properties:
      HostedZoneId: !Ref CustomDomainHostedZoneId
      Name: !Ref CustomDomainName
      Type: A
      AliasTarget:
        HostedZoneId: !GetAtt PathsGamesApiCustomDomain.RegionalHostedZoneId
        DNSName: !GetAtt PathsGamesApiCustomDomain.RegionalDomainName

  # v0.42.0 — monitoring of the public stages: dashboard always, alarms only with an AlarmEmail.
  # Names start with pathsgames-${Environment} to match the deploy user's IAM policy (alpha README).
  MonitoringDashboard:
    Type: AWS::CloudWatch::Dashboard
    Condition: IsPublicStage
    Properties:
      DashboardName: !Sub "pathsgames-${Environment}"
      DashboardBody: !Sub |
          {"widgets": [
            {"type": "metric", "x": 0, "y": 0, "width": 8, "height": 6, "properties": {"title": "Lambda Invocations", "region": "${AWS::Region}", "stat": "Sum", "period": 300, "view": "timeSeries", "metrics": [["AWS/Lambda", "Invocations", "FunctionName", "pathsgames-${Environment}-AdminIpAuthorizer"], [".", ".", ".", "pathsgames-${Environment}-AuthFunction"], [".", ".", ".", "pathsgames-${Environment}-GuestCleanupFunction"], [".", ".", ".", "pathsgames-${Environment}-EchoFunction"], [".", ".", ".", "pathsgames-${Environment}-ContentFunction"], [".", ".", ".", "pathsgames-${Environment}-MatchFunction"], [".", ".", ".", "pathsgames-${Environment}-StoryFunction"], [".", ".", ".", "pathsgames-${Environment}-SeedFunction"]]}},
            {"type": "metric", "x": 8, "y": 0, "width": 8, "height": 6, "properties": {"title": "Lambda Errors", "region": "${AWS::Region}", "stat": "Sum", "period": 300, "view": "timeSeries", "metrics": [["AWS/Lambda", "Errors", "FunctionName", "pathsgames-${Environment}-AdminIpAuthorizer"], [".", ".", ".", "pathsgames-${Environment}-AuthFunction"], [".", ".", ".", "pathsgames-${Environment}-GuestCleanupFunction"], [".", ".", ".", "pathsgames-${Environment}-EchoFunction"], [".", ".", ".", "pathsgames-${Environment}-ContentFunction"], [".", ".", ".", "pathsgames-${Environment}-MatchFunction"], [".", ".", ".", "pathsgames-${Environment}-StoryFunction"], [".", ".", ".", "pathsgames-${Environment}-SeedFunction"]]}},
            {"type": "metric", "x": 16, "y": 0, "width": 8, "height": 6, "properties": {"title": "Lambda Throttles", "region": "${AWS::Region}", "stat": "Sum", "period": 300, "view": "timeSeries", "metrics": [["AWS/Lambda", "Throttles", "FunctionName", "pathsgames-${Environment}-AdminIpAuthorizer"], [".", ".", ".", "pathsgames-${Environment}-AuthFunction"], [".", ".", ".", "pathsgames-${Environment}-GuestCleanupFunction"], [".", ".", ".", "pathsgames-${Environment}-EchoFunction"], [".", ".", ".", "pathsgames-${Environment}-ContentFunction"], [".", ".", ".", "pathsgames-${Environment}-MatchFunction"], [".", ".", ".", "pathsgames-${Environment}-StoryFunction"], [".", ".", ".", "pathsgames-${Environment}-SeedFunction"]]}},
            {"type": "metric", "x": 0, "y": 6, "width": 8, "height": 6, "properties": {"title": "Lambda Duration p95", "region": "${AWS::Region}", "stat": "p95", "period": 300, "view": "timeSeries", "metrics": [["AWS/Lambda", "Duration", "FunctionName", "pathsgames-${Environment}-AdminIpAuthorizer"], [".", ".", ".", "pathsgames-${Environment}-AuthFunction"], [".", ".", ".", "pathsgames-${Environment}-GuestCleanupFunction"], [".", ".", ".", "pathsgames-${Environment}-EchoFunction"], [".", ".", ".", "pathsgames-${Environment}-ContentFunction"], [".", ".", ".", "pathsgames-${Environment}-MatchFunction"], [".", ".", ".", "pathsgames-${Environment}-StoryFunction"], [".", ".", ".", "pathsgames-${Environment}-SeedFunction"]]}},
            {"type": "metric", "x": 8, "y": 6, "width": 8, "height": 6, "properties": {"title": "Lambda ConcurrentExecutions", "region": "${AWS::Region}", "stat": "Maximum", "period": 300, "view": "timeSeries", "metrics": [["AWS/Lambda", "ConcurrentExecutions", "FunctionName", "pathsgames-${Environment}-AdminIpAuthorizer"], [".", ".", ".", "pathsgames-${Environment}-AuthFunction"], [".", ".", ".", "pathsgames-${Environment}-GuestCleanupFunction"], [".", ".", ".", "pathsgames-${Environment}-EchoFunction"], [".", ".", ".", "pathsgames-${Environment}-ContentFunction"], [".", ".", ".", "pathsgames-${Environment}-MatchFunction"], [".", ".", ".", "pathsgames-${Environment}-StoryFunction"], [".", ".", ".", "pathsgames-${Environment}-SeedFunction"]]}},
            {"type": "metric", "x": 16, "y": 6, "width": 8, "height": 6, "properties": {"title": "Public API: Count, 4xx, 5xx, Latency p95", "region": "${AWS::Region}", "period": 300, "view": "timeSeries", "metrics": [["AWS/ApiGateway", "Count", "ApiId", "${PathsGamesApi}", "Stage", "${Environment}", {"stat": "Sum"}], [".", "4xx", ".", ".", ".", ".", {"stat": "Sum"}], [".", "5xx", ".", ".", ".", ".", {"stat": "Sum"}], [".", "Latency", ".", ".", ".", ".", {"stat": "p95", "yAxis": "right"}]]}},
            {"type": "metric", "x": 0, "y": 12, "width": 8, "height": 6, "properties": {"title": "Admin API: Count, 4xx, 5xx, Latency p95", "region": "${AWS::Region}", "period": 300, "view": "timeSeries", "metrics": [["AWS/ApiGateway", "Count", "ApiId", "${PathsGamesAdminApi}", "Stage", "${Environment}", {"stat": "Sum"}], [".", "4xx", ".", ".", ".", ".", {"stat": "Sum"}], [".", "5xx", ".", ".", ".", ".", {"stat": "Sum"}], [".", "Latency", ".", ".", ".", ".", {"stat": "p95", "yAxis": "right"}]]}},
            {"type": "metric", "x": 8, "y": 12, "width": 8, "height": 6, "properties": {"title": "DynamoDB RCU, WCU, Throttles", "region": "${AWS::Region}", "period": 300, "view": "timeSeries", "metrics": [["AWS/DynamoDB", "ConsumedReadCapacityUnits", "TableName", "${PathsGamesTable}", {"stat": "Sum"}], [".", "ConsumedWriteCapacityUnits", ".", ".", {"stat": "Sum"}], [".", "ReadThrottleEvents", ".", ".", {"stat": "Sum"}], [".", "WriteThrottleEvents", ".", ".", {"stat": "Sum"}]]}},
            {"type": "metric", "x": 16, "y": 12, "width": 8, "height": 6, "properties": {"title": "DynamoDB SystemErrors", "region": "${AWS::Region}", "period": 300, "view": "timeSeries", "stat": "Sum", "metrics": [[{"expression": "SEARCH('{AWS/DynamoDB,Operation,TableName} MetricName=\"SystemErrors\" TableName=\"${PathsGamesTable}\"', 'Sum', 300)", "id": "e1", "label": "SystemErrors"}]]}}
          ]}

  AlarmTopic:
    Type: AWS::SNS::Topic
    Condition: HasAlarms
    Properties:
      TopicName: !Sub "pathsgames-${Environment}-alarms"
      Tags:
        - Key: Name
          Value: !Sub "pathsgames-${Environment}-alarms"
        - Key: CostCenter
          Value: Paths.games
        - Key: Environment
          Value: !FindInMap [EnvironmentTags, !Ref Environment, Name]
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Owner
          Value: AlNao
        - Key: Project
          Value: !FindInMap [EnvironmentTags, !Ref Environment, Project]
        - Key: version
          Value: !Ref Version

  AlarmEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlarms
    Properties:
      TopicArn: !Ref AlarmTopic
      Protocol: email
      Endpoint: !Ref AlarmEmail

  LambdaErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAlarms
    Properties:
      AlarmName: !Sub "pathsgames-${Environment}-lambda-errors"
      AlarmDescription: "v0.42.0 - at least 5 Lambda errors in 5 minutes, summed over the 8 functions."
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Threshold: 5
      EvaluationPeriods: 1
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
      Metrics:
        - Id: total
          Expression: "SUM(METRICS())"
          Label: "Errors of the 8 functions"
          ReturnData: true
        - Id: f1
          ReturnData: false
          MetricStat:
            Stat: Sum
            Period: 300
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: !Sub "pathsgames-${Environment}-AdminIpAuthorizer"
        - Id: f2
          ReturnData: false
          MetricStat:
            Stat: Sum
            Period: 300
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: !Sub "pathsgames-${Environment}-AuthFunction"
        - Id: f3
          ReturnData: false
          MetricStat:
            Stat: Sum
            Period: 300
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: !Sub "pathsgames-${Environment}-GuestCleanupFunction"
        - Id: f4
          ReturnData: false
          MetricStat:
            Stat: Sum
            Period: 300
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: !Sub "pathsgames-${Environment}-EchoFunction"
        - Id: f5
          ReturnData: false
          MetricStat:
            Stat: Sum
            Period: 300
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: !Sub "pathsgames-${Environment}-ContentFunction"
        - Id: f6
          ReturnData: false
          MetricStat:
            Stat: Sum
            Period: 300
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: !Sub "pathsgames-${Environment}-MatchFunction"
        - Id: f7
          ReturnData: false
          MetricStat:
            Stat: Sum
            Period: 300
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: !Sub "pathsgames-${Environment}-StoryFunction"
        - Id: f8
          ReturnData: false
          MetricStat:
            Stat: Sum
            Period: 300
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: !Sub "pathsgames-${Environment}-SeedFunction"

  LambdaThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAlarms
    Properties:
      AlarmName: !Sub "pathsgames-${Environment}-lambda-throttles"
      AlarmDescription: "v0.42.0 - at least 1 Lambda throttle in 5 minutes, summed over the 8 functions."
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Threshold: 1
      EvaluationPeriods: 1
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
      Metrics:
        - Id: total
          Expression: "SUM(METRICS())"
          Label: "Throttles of the 8 functions"
          ReturnData: true
        - Id: f1
          ReturnData: false
          MetricStat:
            Stat: Sum
            Period: 300
            Metric:
              Namespace: AWS/Lambda
              MetricName: Throttles
              Dimensions:
                - Name: FunctionName
                  Value: !Sub "pathsgames-${Environment}-AdminIpAuthorizer"
        - Id: f2
          ReturnData: false
          MetricStat:
            Stat: Sum
            Period: 300
            Metric:
              Namespace: AWS/Lambda
              MetricName: Throttles
              Dimensions:
                - Name: FunctionName
                  Value: !Sub "pathsgames-${Environment}-AuthFunction"
        - Id: f3
          ReturnData: false
          MetricStat:
            Stat: Sum
            Period: 300
            Metric:
              Namespace: AWS/Lambda
              MetricName: Throttles
              Dimensions:
                - Name: FunctionName
                  Value: !Sub "pathsgames-${Environment}-GuestCleanupFunction"
        - Id: f4
          ReturnData: false
          MetricStat:
            Stat: Sum
            Period: 300
            Metric:
              Namespace: AWS/Lambda
              MetricName: Throttles
              Dimensions:
                - Name: FunctionName
                  Value: !Sub "pathsgames-${Environment}-EchoFunction"
        - Id: f5
          ReturnData: false
          MetricStat:
            Stat: Sum
            Period: 300
            Metric:
              Namespace: AWS/Lambda
              MetricName: Throttles
              Dimensions:
                - Name: FunctionName
                  Value: !Sub "pathsgames-${Environment}-ContentFunction"
        - Id: f6
          ReturnData: false
          MetricStat:
            Stat: Sum
            Period: 300
            Metric:
              Namespace: AWS/Lambda
              MetricName: Throttles
              Dimensions:
                - Name: FunctionName
                  Value: !Sub "pathsgames-${Environment}-MatchFunction"
        - Id: f7
          ReturnData: false
          MetricStat:
            Stat: Sum
            Period: 300
            Metric:
              Namespace: AWS/Lambda
              MetricName: Throttles
              Dimensions:
                - Name: FunctionName
                  Value: !Sub "pathsgames-${Environment}-StoryFunction"
        - Id: f8
          ReturnData: false
          MetricStat:
            Stat: Sum
            Period: 300
            Metric:
              Namespace: AWS/Lambda
              MetricName: Throttles
              Dimensions:
                - Name: FunctionName
                  Value: !Sub "pathsgames-${Environment}-SeedFunction"

  PublicApi5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAlarms
    Properties:
      AlarmName: !Sub "pathsgames-${Environment}-public-api-5xx"
      AlarmDescription: "v0.42.0 - at least 5 server errors in 5 minutes on the public API."
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - Name: ApiId
          Value: !Ref PathsGamesApi
        - Name: Stage
          Value: !Ref Environment
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  AdminApi5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAlarms
    Properties:
      AlarmName: !Sub "pathsgames-${Environment}-admin-api-5xx"
      AlarmDescription: "v0.42.0 - at least 5 server errors in 5 minutes on the admin API."
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - Name: ApiId
          Value: !Ref PathsGamesAdminApi
        - Name: Stage
          Value: !Ref Environment
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  DynamoDbThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAlarms
    Properties:
      AlarmName: !Sub "pathsgames-${Environment}-dynamodb-throttles"
      AlarmDescription: "v0.42.0 - at least 1 throttled read or write on the table in 5 minutes."
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Threshold: 1
      EvaluationPeriods: 1
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
      Metrics:
        - Id: total
          Expression: "SUM(METRICS())"
          Label: "Read and write throttle events"
          ReturnData: true
        - Id: reads
          ReturnData: false
          MetricStat:
            Stat: Sum
            Period: 300
            Metric:
              Namespace: AWS/DynamoDB
              MetricName: ReadThrottleEvents
              Dimensions:
                - Name: TableName
                  Value: !Ref PathsGamesTable
        - Id: writes
          ReturnData: false
          MetricStat:
            Stat: Sum
            Period: 300
            Metric:
              Namespace: AWS/DynamoDB
              MetricName: WriteThrottleEvents
              Dimensions:
                - Name: TableName
                  Value: !Ref PathsGamesTable

  # v0.42.0 — monthly cost budget on the Project tag (this stack + the websites); tag activated by hand in Billing.
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Condition: HasBudget
    Properties:
      Budget:
        BudgetName: !Sub "pathsgames-${Environment}-monthly"
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref BudgetLimit
          Unit: USD
        CostFilters:
          TagKeyValue:
            - !Join ["", ["user:Project$", !FindInMap [EnvironmentTags, !Ref Environment, Project]]]
            - "user:Project$Paths.games.aws.websites"
      NotificationsWithSubscribers: !If
        - HasBudgetEmail
        - - Notification:
              NotificationType: ACTUAL
              ComparisonOperator: GREATER_THAN
              Threshold: 80
              ThresholdType: PERCENTAGE
            Subscribers:
              - SubscriptionType: EMAIL
                Address: !Ref BudgetEmail
          - Notification:
              NotificationType: FORECASTED
              ComparisonOperator: GREATER_THAN
              Threshold: 100
              ThresholdType: PERCENTAGE
            Subscribers:
              - SubscriptionType: EMAIL
                Address: !Ref BudgetEmail
        - !Ref AWS::NoValue

  # Nested Stacks (Modules)

  EchoModule:
    Type: AWS::Serverless::Application
    DependsOn: [PathsGamesApi, PathsGamesAdminApi, AdminIpAuthorizer]
    Properties:
      Location: template/echo.yaml
      Tags:
        Name: !Sub "pathsgames-${Environment}-EchoModule"
        CostCenter: Paths.games
        Environment: !FindInMap [EnvironmentTags, !Ref Environment, Name]
        ManagedBy: CloudFormation
        Owner: AlNao
        Project: !FindInMap [EnvironmentTags, !Ref Environment, Project]
        version: !Ref Version
      Parameters:
        Environment: !Ref Environment
        EnvironmentTag: !FindInMap [EnvironmentTags, !Ref Environment, Name]
        Version: !Ref Version
        LambdaSystemLogLevel: !Ref LambdaSystemLogLevel
        TableName: !Ref PathsGamesTable
        ApiId: !Ref PathsGamesApi
        AdminApiId: !Ref PathsGamesAdminApi
        AdminAuthorizerId: !Ref AdminIpAuthorizer

  AuthModule:
    Type: AWS::Serverless::Application
    DependsOn: [PathsGamesApi, PathsGamesAdminApi, AdminIpAuthorizer]
    Properties:
      Location: template/auth.yaml
      Tags:
        Name: !Sub "pathsgames-${Environment}-AuthModule"
        CostCenter: Paths.games
        Environment: !FindInMap [EnvironmentTags, !Ref Environment, Name]
        ManagedBy: CloudFormation
        Owner: AlNao
        Project: !FindInMap [EnvironmentTags, !Ref Environment, Project]
        version: !Ref Version
      Parameters:
        Environment: !Ref Environment
        EnvironmentTag: !FindInMap [EnvironmentTags, !Ref Environment, Name]
        Version: !Ref Version
        LambdaSystemLogLevel: !Ref LambdaSystemLogLevel
        TableName: !Ref PathsGamesTable
        ApiId: !Ref PathsGamesApi
        AdminApiId: !Ref PathsGamesAdminApi
        AdminAuthorizerId: !Ref AdminIpAuthorizer
        JwtSecret: !Ref JwtSecret
        AllowMockAccess: !Ref AllowMockAccess
        AdminIpWhitelist: !Ref AdminIpWhitelist
        AdminIpEmptyMeans: !Ref AdminIpEmptyMeans
        RateLimitGuestPerIp: !Ref RateLimitGuestPerIp
        RateLimitWindowSeconds: !Ref RateLimitWindowSeconds
        CsrfEnforced: !Ref CsrfEnforced
        RobotTestDataTtlHours: !Ref RobotTestDataTtlHours
        GuestCleanupEnabled: !Ref GuestCleanupEnabled
        GuestCleanupAgeDays: !Ref GuestCleanupAgeDays
        GuestCleanupMaxPerRun: !Ref GuestCleanupMaxPerRun
        GuestCleanupSchedule: !Ref GuestCleanupSchedule

  StoryModule:
    Type: AWS::Serverless::Application
    DependsOn: [PathsGamesApi, PathsGamesAdminApi, AdminIpAuthorizer]
    Properties:
      Location: template/story.yaml
      Tags:
        Name: !Sub "pathsgames-${Environment}-StoryModule"
        CostCenter: Paths.games
        Environment: !FindInMap [EnvironmentTags, !Ref Environment, Name]
        ManagedBy: CloudFormation
        Owner: AlNao
        Project: !FindInMap [EnvironmentTags, !Ref Environment, Project]
        version: !Ref Version
      Parameters:
        Environment: !Ref Environment
        EnvironmentTag: !FindInMap [EnvironmentTags, !Ref Environment, Name]
        Version: !Ref Version
        LambdaSystemLogLevel: !Ref LambdaSystemLogLevel
        StoryCacheTtlSeconds: !Ref StoryCacheTtlSeconds
        TableName: !Ref PathsGamesTable
        ApiId: !Ref PathsGamesApi
        AdminApiId: !Ref PathsGamesAdminApi
        AdminAuthorizerId: !Ref AdminIpAuthorizer
        # v0.41.0 — the story admin API verifies tokens: it needs the same secret as Auth
        JwtSecret: !Ref JwtSecret
        AllowMockAccess: !Ref AllowMockAccess
        AdminIpWhitelist: !Ref AdminIpWhitelist
        AdminIpEmptyMeans: !Ref AdminIpEmptyMeans
        WebsiteBucket: !Ref WebsiteBucket
        WebsiteCloudFrontId: !Ref WebsiteCloudFrontId
        CatalogLangs: !Ref CatalogLangs

  # Step 19 — single-player match creation
  MatchModule:
    Type: AWS::Serverless::Application
    DependsOn: [PathsGamesApi, PathsGamesAdminApi, AdminIpAuthorizer]
    Properties:
      Location: template/match.yaml
      Tags:
        Name: !Sub "pathsgames-${Environment}-MatchModule"
        CostCenter: Paths.games
        Environment: !FindInMap [EnvironmentTags, !Ref Environment, Name]
        ManagedBy: CloudFormation
        Owner: AlNao
        Project: !FindInMap [EnvironmentTags, !Ref Environment, Project]
        version: !Ref Version
      Parameters:
        Environment: !Ref Environment
        EnvironmentTag: !FindInMap [EnvironmentTags, !Ref Environment, Name]
        Version: !Ref Version
        LambdaSystemLogLevel: !Ref LambdaSystemLogLevel
        StoryCacheTtlSeconds: !Ref StoryCacheTtlSeconds
        TableName: !Ref PathsGamesTable
        ApiId: !Ref PathsGamesApi
        AdminApiId: !Ref PathsGamesAdminApi
        AdminAuthorizerId: !Ref AdminIpAuthorizer
        JwtSecret: !Ref JwtSecret
        TurnstileSecretKey: !Ref TurnstileSecretKey
        TurnstileBypassToken: !Ref TurnstileBypassToken
        AllowMockAccess: !Ref AllowMockAccess
        AdminIpWhitelist: !Ref AdminIpWhitelist
        AdminIpEmptyMeans: !Ref AdminIpEmptyMeans
        RateLimitMatchPerIp: !Ref RateLimitMatchPerIp
        RateLimitWindowSeconds: !Ref RateLimitWindowSeconds
        RateLimitMatchPerGuest: !Ref RateLimitMatchPerGuest
        RateLimitMatchPerGuestWindowSeconds: !Ref RateLimitMatchPerGuestWindowSeconds
        CsrfEnforced: !Ref CsrfEnforced
        RobotTestDataTtlHours: !Ref RobotTestDataTtlHours

  ContentModule:
    Type: AWS::Serverless::Application
    DependsOn: PathsGamesApi
    Properties:
      Location: template/content.yaml
      Tags:
        Name: !Sub "pathsgames-${Environment}-ContentModule"
        CostCenter: Paths.games
        Environment: !FindInMap [EnvironmentTags, !Ref Environment, Name]
        ManagedBy: CloudFormation
        Owner: AlNao
        Project: !FindInMap [EnvironmentTags, !Ref Environment, Project]
        version: !Ref Version
      Parameters:
        Environment: !Ref Environment
        EnvironmentTag: !FindInMap [EnvironmentTags, !Ref Environment, Name]
        Version: !Ref Version
        LambdaSystemLogLevel: !Ref LambdaSystemLogLevel
        StoryCacheTtlSeconds: !Ref StoryCacheTtlSeconds
        TableName: !Ref PathsGamesTable
        ApiId: !Ref PathsGamesApi
        AllowMockAccess: !Ref AllowMockAccess

  SeedModule:
    Type: AWS::Serverless::Application
    DependsOn: [PathsGamesApi, PathsGamesAdminApi, AdminIpAuthorizer]
    Properties:
      Location: template/seed.yaml
      Tags:
        Name: !Sub "pathsgames-${Environment}-SeedModule"
        CostCenter: Paths.games
        Environment: !FindInMap [EnvironmentTags, !Ref Environment, Name]
        ManagedBy: CloudFormation
        Owner: AlNao
        Project: !FindInMap [EnvironmentTags, !Ref Environment, Project]
        version: !Ref Version
      Parameters:
        Environment: !Ref Environment
        EnvironmentTag: !FindInMap [EnvironmentTags, !Ref Environment, Name]
        Version: !Ref Version
        LambdaSystemLogLevel: !Ref LambdaSystemLogLevel
        TableName: !Ref PathsGamesTable
        AdminApiId: !Ref PathsGamesAdminApi
        AdminAuthorizerId: !Ref AdminIpAuthorizer
        SeedBcryptHash: !Ref SeedBcryptHash
        # v0.41.0 — the seed signs the tokens it hands out: same secret as Auth
        JwtSecret: !Ref JwtSecret
        AllowMockAccess: !Ref AllowMockAccess

Outputs:
  ApiUrl:
    Description: "API Endpoint URL (public/player surface)"
    Value: !Sub "https://${PathsGamesApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/"
  AdminApiUrl:
    Description: "Admin API Endpoint URL (/api/admin/** only, IP-restricted via authorizer)"
    Value: !Sub "https://${PathsGamesAdminApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/"
  TableName:
    Description: "DynamoDB Table Name"
    Value: !Ref PathsGamesTable
  DashboardUrl:
    Condition: IsPublicStage
    Description: "v0.42.0 - CloudWatch dashboard of the stage"
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=pathsgames-${Environment}"
  SeedEndpoint:
    Description: "Dev seed endpoint (on the IP-restricted admin API)"
    Value: !Sub "https://${PathsGamesAdminApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/api/dev/seed"
