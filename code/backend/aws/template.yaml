AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: "Paths Games - Backend Serverless (AWS SAM)"

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, test, prod]
    Description: "Deploy environment. Suffix of every resource name, API stage and Lambda ENV; the Environment tag is mapped from it (prod -> production)."
  Version:
    Type: String
    Default: "0.38.1"
    Description: "Project version, applied as the `version` tag on every resource. Source: VERSION in the root .env; code/scripts/dev/bump-version.sh keeps this default in sync."
  JwtSecret:
    Type: String
    NoEcho: true
    Default: PathsGamesDevSecret2026_MustBeAtLeast32Chars!
    Description: "Secret key for JWT verification"
  TurnstileSecretKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: "Cloudflare Turnstile secret key. Leave empty to disable validation (dev bypass)."
  TurnstileBypassToken:
    Type: String
    NoEcho: true
    Default: ""
    Description: "Optional Robot-test bypass token. When non-empty, an incoming turnstileToken equal to this value skips Cloudflare verification. Leave empty in prod."
  AllowMockAccess:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: "Enable MOCK_ACCESS_/MOCK_REFRESH_ tokens (dev convenience). Set to 'false' in production."
  # v0.37.7 — Step 41. Fixed-window limits per source IP on POST /api/auth/guest and
  # POST /api/matches; "0" disables a bucket (dev / Robot default), prod sets "10".
  RateLimitGuestPerIp:
    Type: String
    Default: "0"
    Description: "Max new guest sessions per source IP per window. 0 = disabled."
  RateLimitMatchPerIp:
    Type: String
    Default: "0"
    Description: "Max new matches per source IP per window. 0 = disabled."
  RateLimitWindowSeconds:
    Type: String
    Default: "3600"
    Description: "Length of the rate-limit window, in seconds."
  # v0.39.1 — robottest guests/matches get a DynamoDB ttl, honoured only on dev/test stacks.
  RobotTestDataTtlHours:
    Type: String
    Default: "0"
    Description: "Hours after which Robot test guests and matches expire via TTL. 0 = disabled."
  CsrfEnforced:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: "Require the csrfToken issued at login back as X-CSRF-TOKEN on POST /api/matches."
  SeedBcryptHash:
    Type: String
    NoEcho: true
    Default: ""
    Description: "BCrypt hash for seed users (dev-only). Pass at deploy time, do not store in code."
  CustomDomainName:
    Type: String
    Default: ""
    Description: "Optional. Custom public domain (e.g., api-dev.paths.games)"
  CustomDomainCertificateArn:
    Type: String
    Default: ""
    Description: "Optional. ARN of the ACM certificate for the custom domain"
  CustomDomainHostedZoneId:
    Type: String
    Default: ""
    Description: "Optional. Global Route53 Hosted Zone ID for automatic Alias record"
  CorsAllowOrigins:
    Type: CommaDelimitedList
    Default: "http://localhost,http://localhost:3000,http://localhost:5173,http://localhost:5174,http://localhost:8042,http://localhost:8080,http://127.0.0.1,http://127.0.0.1:3000,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:8042,http://127.0.0.1:8080,http://127.0.0.1:5500,https://paths.games,https://www.paths.games,https://test.paths.games"
    Description: "Comma-separated list of CORS allowed origins (e.g. https://app.paths.games,http://localhost:5173,http://localhost:5174)"
  AdminIpWhitelist:
    Type: String
    Default: ""
    Description: "Comma-separated list of IPs allowed to call /api/admin/** endpoints. Empty = no IP restriction (insecure, dev only). Example: 1.2.3.4,5.6.7.8"
  StoryCacheTtlSeconds:
    Type: String
    Default: "3600"
    Description: "v0.37.5 - seconds a Lambda container keeps a STORY item in memory (0 = no cache). A SYSTEM#cache stamp already invalidates on every write; POST /api/admin/cache/flush invalidates everywhere."
  WebsiteBucket:
    Type: String
    Default: ""
    Description: "v0.37.6 - S3 bucket of the game website (test.paths.games). POST /api/admin/stories/catalog writes data/stories-{lang}.json there; empty = endpoint answers 503."
  WebsiteCloudFrontId:
    Type: String
    Default: ""
    Description: "v0.37.6 - CloudFront distribution id of the website, invalidated (/data/stories-*.json only) after a catalog write. Empty = no invalidation."
  CatalogLangs:
    Type: String
    Default: "en,it"
    Description: "v0.37.6 - languages written by the static catalog export."
  TableBillingMode:
    Type: String
    Default: PAY_PER_REQUEST
    AllowedValues: [PAY_PER_REQUEST, PROVISIONED]
    Description: "v0.37.5 - PROVISIONED keeps a dev table inside the always-free 25 RCU/WCU (table + GSIs share them); prod stays PAY_PER_REQUEST."
  TableReadCapacity:
    Type: Number
    Default: 10
    Description: "Table RCU when PROVISIONED (ignored otherwise)."
  TableWriteCapacity:
    Type: Number
    Default: 10
    Description: "Table WCU when PROVISIONED (ignored otherwise)."
  GsiReadCapacity:
    Type: Number
    Default: 5
    Description: "RCU of each GSI when PROVISIONED (ignored otherwise)."
  GsiWriteCapacity:
    Type: Number
    Default: 5
    Description: "WCU of each GSI when PROVISIONED (ignored otherwise)."
  LambdaSystemLogLevel:
    Type: String
    Default: WARN
    AllowedValues: [DEBUG, INFO, WARN]
    Description: "v0.37.5 - WARN drops the START/END/REPORT lines of every invocation (CloudWatch ingestion); INFO brings the REPORT back for memory tuning."

Mappings:
  # Environment tag value per deploy environment. The parameter keeps `prod` because resource
  # names, the API stage and the Lambda ENV guards key on it; only the tag says `production`.
  EnvironmentTags:
    dev:
      Name: dev
    test:
      Name: test
    prod:
      Name: production

Conditions:
  IsProvisioned: !Equals [!Ref TableBillingMode, PROVISIONED]
  HasCustomDomain: !Not [!Equals [!Ref CustomDomainName, ""]]
  HasCustomDomainAndHostedZone: !And
    - !Not [!Equals [!Ref CustomDomainName, ""]]
    - !Not [!Equals [!Ref CustomDomainHostedZoneId, ""]]

Resources:
  # DynamoDB Table (Single Table Design)
  PathsGamesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "PathsGamesBackend-${Environment}"
      Tags:
        - Key: Name
          Value: !Sub "PathsGamesBackend-${Environment}"
        - Key: CostCenter
          Value: Paths.games
        - Key: Environment
          Value: !FindInMap [EnvironmentTags, !Ref Environment, Name]
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Owner
          Value: AlNao
        - Key: Project
          Value: Paths.games.aws.serverless
        - Key: version
          Value: !Ref Version
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1_PK
          AttributeType: S
        - AttributeName: GSI1_SK
          AttributeType: S
        - AttributeName: GSI2_PK
          AttributeType: S
        - AttributeName: GSI2_SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      # v0.37.5 — PROVISIONED (dev) stays inside the always-free 25 RCU/WCU; prod is on-demand.
      BillingMode: !Ref TableBillingMode
      # v0.37.7 — the rate-limit counters (RATELIMIT#…) carry a `ttl` so they expire on their own.
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      ProvisionedThroughput: !If
        - IsProvisioned
        - ReadCapacityUnits: !Ref TableReadCapacity
          WriteCapacityUnits: !Ref TableWriteCapacity
        - !Ref AWS::NoValue
      GlobalSecondaryIndexes:
        # v0.37.5 — both indexes are INCLUDE projections: a match's state and a story's
        # 300 KB of texts are never replicated. GSI1 = "by owner" (USER_MATCHES#<uuid>,
        # GUEST_TOKEN#<token>), GSI2 = "by type" (MATCH, STORY_LIST, GUEST_LIST).
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1_PK
              KeyType: HASH
            - AttributeName: GSI1_SK
              KeyType: RANGE
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes:
              # match summary (_summary_from_item)
              - uuid
              - storyUuid
              - difficultyUuid
              - name
              - status
              - currentClock
              - expCost
              - rngSeed
              - userCreatorUuid
              - tsInsert
              - singlePlayer
              - characterTemplateUuid
              - classUuid
              - traitUuids
              # guest resume (auth/handler.py resume_guest)
              - username
              - role
              - token_version
              - guest_token
          ProvisionedThroughput: !If
            - IsProvisioned
            - ReadCapacityUnits: !Ref GsiReadCapacity
              WriteCapacityUnits: !Ref GsiWriteCapacity
            - !Ref AWS::NoValue
        # GSI2_SK="{tsInsert:020d}#{uuid}" on matches: the admin list is one newest-first
        # Query (sinceDays = SK range). Stories and guests carry ONE ``summary`` map with
        # everything their list needs — DynamoDB caps NonKeyAttributes at 20 per index.
        - IndexName: GSI2
          KeySchema:
            - AttributeName: GSI2_PK
              KeyType: HASH
            - AttributeName: GSI2_SK
              KeyType: RANGE
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes:
              - uuid
              - storyUuid
              - difficultyUuid
              - name
              - status
              - currentClock
              - expCost
              - rngSeed
              - userCreatorUuid
              - tsInsert
              - singlePlayer
              - characterTemplateUuid
              - classUuid
              - traitUuids
              - summary
          ProvisionedThroughput: !If
            - IsProvisioned
            - ReadCapacityUnits: !Ref GsiReadCapacity
              WriteCapacityUnits: !Ref GsiWriteCapacity
            - !Ref AWS::NoValue

  # HTTP API (API Gateway v2) — public/player surface.
  # v0.37.7 — a plain AWS::ApiGatewayV2::Api, NOT AWS::Serverless::HttpApi: SAM renders the
  # latter as an Api with an OpenAPI `Body` (paths: {}), and every update of that body
  # (a CORS or tag change) re-imports the definition and DELETES the routes the nested
  # modules created — the stage then keeps serving its last snapshot, silently stale.
  PathsGamesApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "pathsgames-${Environment}"
      ProtocolType: HTTP
      Tags:
        Name: !Sub "pathsgames-${Environment}"
        CostCenter: Paths.games
        Environment: !FindInMap [EnvironmentTags, !Ref Environment, Name]
        ManagedBy: CloudFormation
        Owner: AlNao
        Project: Paths.games.aws.serverless
        version: !Ref Version
      CorsConfiguration:
        AllowMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
        AllowOrigins: !Ref CorsAllowOrigins
        # X-CSRF-TOKEN rides on POST /api/matches; without it here the browser's preflight
        # fails and the game never reaches the API. Retry-After is read on a 429.
        AllowHeaders: [Content-Type, Authorization, Cookie, X-CSRF-TOKEN]
        ExposeHeaders: [Retry-After]
        AllowCredentials: true

  PathsGamesApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref PathsGamesApi
      StageName: !Ref Environment
      AutoDeploy: true
      Tags:
        Name: !Sub "pathsgames-${Environment}-ApiStage"
        CostCenter: Paths.games
        Environment: !FindInMap [EnvironmentTags, !Ref Environment, Name]
        ManagedBy: CloudFormation
        Owner: AlNao
        Project: Paths.games.aws.serverless
        version: !Ref Version

  # Dedicated ADMIN HTTP API — serves ONLY /api/admin/** routes and is gated by an
  # IP-allow-list Lambda authorizer (the AWS-side equivalent of the 8044 admin port).
  PathsGamesAdminApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "pathsgames-${Environment}-admin"
      ProtocolType: HTTP
      Tags:
        Name: !Sub "pathsgames-${Environment}-admin"
        CostCenter: Paths.games
        Environment: !FindInMap [EnvironmentTags, !Ref Environment, Name]
        ManagedBy: CloudFormation
        Owner: AlNao
        Project: Paths.games.aws.serverless
        version: !Ref Version
      CorsConfiguration:
        AllowMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
        AllowOrigins: !Ref CorsAllowOrigins
        AllowHeaders: [Content-Type, Authorization, Cookie]
        AllowCredentials: true

  PathsGamesAdminApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref PathsGamesAdminApi
      StageName: !Ref Environment
      AutoDeploy: true
      Tags:
        Name: !Sub "pathsgames-${Environment}-AdminApiStage"
        CostCenter: Paths.games
        Environment: !FindInMap [EnvironmentTags, !Ref Environment, Name]
        ManagedBy: CloudFormation
        Owner: AlNao
        Project: Paths.games.aws.serverless
        version: !Ref Version

  AdminIpAuthorizerLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/pathsgames-${Environment}-AdminIpAuthorizer"
      RetentionInDays: 14
      Tags:
        - Key: Name
          Value: !Sub "/aws/lambda/pathsgames-${Environment}-AdminIpAuthorizer"
        - Key: CostCenter
          Value: Paths.games
        - Key: Environment
          Value: !FindInMap [EnvironmentTags, !Ref Environment, Name]
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Owner
          Value: AlNao
        - Key: Project
          Value: Paths.games.aws.serverless
        - Key: version
          Value: !Ref Version

  AdminIpAuthorizerFunction:
    Type: AWS::Serverless::Function
    DependsOn: AdminIpAuthorizerLogGroup
    Properties:
      FunctionName: !Sub "pathsgames-${Environment}-AdminIpAuthorizer"
      Runtime: python3.13
      Handler: authorizer.handler.lambda_handler
      Architectures: [arm64]
      LoggingConfig:
        LogFormat: JSON
        SystemLogLevel: !Ref LambdaSystemLogLevel
        ApplicationLogLevel: INFO
      Timeout: 10
      MemorySize: 128
      CodeUri: lambda/
      Tags:
        Name: !Sub "pathsgames-${Environment}-AdminIpAuthorizer"
        CostCenter: Paths.games
        Environment: !FindInMap [EnvironmentTags, !Ref Environment, Name]
        ManagedBy: CloudFormation
        Owner: AlNao
        Project: Paths.games.aws.serverless
        version: !Ref Version
      Environment:
        Variables:
          ADMIN_IP_WHITELIST: !Ref AdminIpWhitelist

  # REQUEST authorizer (simple responses). No IdentitySource + TTL 0 → invoked on every
  # request so a changed allow-list takes effect immediately and per-IP caching can't leak.
  AdminIpAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref PathsGamesAdminApi
      Name: AdminIpAuthorizer
      AuthorizerType: REQUEST
      AuthorizerPayloadFormatVersion: "2.0"
      EnableSimpleResponses: true
      AuthorizerResultTtlInSeconds: 0
      # No IdentitySource → the authorizer runs on EVERY admin request (no caching),
      # so the source IP is always checked and allow-list changes take effect at once.
      AuthorizerUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AdminIpAuthorizerFunction.Arn}/invocations"

  AdminIpAuthorizerPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref AdminIpAuthorizerFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${PathsGamesAdminApi}/*"

  PathsGamesApiCustomDomain:
    Type: AWS::ApiGatewayV2::DomainName
    Condition: HasCustomDomain
    Properties:
      DomainName: !Ref CustomDomainName
      DomainNameConfigurations:
        - CertificateArn: !Ref CustomDomainCertificateArn
          EndpointType: REGIONAL
      Tags:
        Name: !Ref CustomDomainName
        CostCenter: Paths.games
        Environment: !FindInMap [EnvironmentTags, !Ref Environment, Name]
        ManagedBy: CloudFormation
        Owner: AlNao
        Project: Paths.games.aws.serverless
        version: !Ref Version

  PathsGamesApiMapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    Condition: HasCustomDomain
    Properties:
      ApiId: !Ref PathsGamesApi
      DomainName: !Ref CustomDomainName
      Stage: !Ref Environment
    DependsOn:
      - PathsGamesApiCustomDomain
      - PathsGamesApi
      - PathsGamesApiStage

  PathsGamesApiDnsRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasCustomDomainAndHostedZone
    Properties:
      HostedZoneId: !Ref CustomDomainHostedZoneId
      Name: !Ref CustomDomainName
      Type: A
      AliasTarget:
        HostedZoneId: !GetAtt PathsGamesApiCustomDomain.RegionalHostedZoneId
        DNSName: !GetAtt PathsGamesApiCustomDomain.RegionalDomainName

  # Nested Stacks (Modules)

  EchoModule:
    Type: AWS::Serverless::Application
    DependsOn: [PathsGamesApi, PathsGamesAdminApi, AdminIpAuthorizer]
    Properties:
      Location: template/echo.yaml
      Tags:
        Name: !Sub "pathsgames-${Environment}-EchoModule"
        CostCenter: Paths.games
        Environment: !FindInMap [EnvironmentTags, !Ref Environment, Name]
        ManagedBy: CloudFormation
        Owner: AlNao
        Project: Paths.games.aws.serverless
        version: !Ref Version
      Parameters:
        Environment: !Ref Environment
        EnvironmentTag: !FindInMap [EnvironmentTags, !Ref Environment, Name]
        Version: !Ref Version
        LambdaSystemLogLevel: !Ref LambdaSystemLogLevel
        TableName: !Ref PathsGamesTable
        ApiId: !Ref PathsGamesApi
        AdminApiId: !Ref PathsGamesAdminApi
        AdminAuthorizerId: !Ref AdminIpAuthorizer

  AuthModule:
    Type: AWS::Serverless::Application
    DependsOn: [PathsGamesApi, PathsGamesAdminApi, AdminIpAuthorizer]
    Properties:
      Location: template/auth.yaml
      Tags:
        Name: !Sub "pathsgames-${Environment}-AuthModule"
        CostCenter: Paths.games
        Environment: !FindInMap [EnvironmentTags, !Ref Environment, Name]
        ManagedBy: CloudFormation
        Owner: AlNao
        Project: Paths.games.aws.serverless
        version: !Ref Version
      Parameters:
        Environment: !Ref Environment
        EnvironmentTag: !FindInMap [EnvironmentTags, !Ref Environment, Name]
        Version: !Ref Version
        LambdaSystemLogLevel: !Ref LambdaSystemLogLevel
        TableName: !Ref PathsGamesTable
        ApiId: !Ref PathsGamesApi
        AdminApiId: !Ref PathsGamesAdminApi
        AdminAuthorizerId: !Ref AdminIpAuthorizer
        JwtSecret: !Ref JwtSecret
        AllowMockAccess: !Ref AllowMockAccess
        AdminIpWhitelist: !Ref AdminIpWhitelist
        RateLimitGuestPerIp: !Ref RateLimitGuestPerIp
        RateLimitWindowSeconds: !Ref RateLimitWindowSeconds
        CsrfEnforced: !Ref CsrfEnforced
        RobotTestDataTtlHours: !Ref RobotTestDataTtlHours

  StoryModule:
    Type: AWS::Serverless::Application
    DependsOn: [PathsGamesApi, PathsGamesAdminApi, AdminIpAuthorizer]
    Properties:
      Location: template/story.yaml
      Tags:
        Name: !Sub "pathsgames-${Environment}-StoryModule"
        CostCenter: Paths.games
        Environment: !FindInMap [EnvironmentTags, !Ref Environment, Name]
        ManagedBy: CloudFormation
        Owner: AlNao
        Project: Paths.games.aws.serverless
        version: !Ref Version
      Parameters:
        Environment: !Ref Environment
        EnvironmentTag: !FindInMap [EnvironmentTags, !Ref Environment, Name]
        Version: !Ref Version
        LambdaSystemLogLevel: !Ref LambdaSystemLogLevel
        StoryCacheTtlSeconds: !Ref StoryCacheTtlSeconds
        TableName: !Ref PathsGamesTable
        ApiId: !Ref PathsGamesApi
        AdminApiId: !Ref PathsGamesAdminApi
        AdminAuthorizerId: !Ref AdminIpAuthorizer
        AllowMockAccess: !Ref AllowMockAccess
        AdminIpWhitelist: !Ref AdminIpWhitelist
        WebsiteBucket: !Ref WebsiteBucket
        WebsiteCloudFrontId: !Ref WebsiteCloudFrontId
        CatalogLangs: !Ref CatalogLangs

  # Step 19 — single-player match creation
  MatchModule:
    Type: AWS::Serverless::Application
    DependsOn: [PathsGamesApi, PathsGamesAdminApi, AdminIpAuthorizer]
    Properties:
      Location: template/match.yaml
      Tags:
        Name: !Sub "pathsgames-${Environment}-MatchModule"
        CostCenter: Paths.games
        Environment: !FindInMap [EnvironmentTags, !Ref Environment, Name]
        ManagedBy: CloudFormation
        Owner: AlNao
        Project: Paths.games.aws.serverless
        version: !Ref Version
      Parameters:
        Environment: !Ref Environment
        EnvironmentTag: !FindInMap [EnvironmentTags, !Ref Environment, Name]
        Version: !Ref Version
        LambdaSystemLogLevel: !Ref LambdaSystemLogLevel
        StoryCacheTtlSeconds: !Ref StoryCacheTtlSeconds
        TableName: !Ref PathsGamesTable
        ApiId: !Ref PathsGamesApi
        AdminApiId: !Ref PathsGamesAdminApi
        AdminAuthorizerId: !Ref AdminIpAuthorizer
        JwtSecret: !Ref JwtSecret
        TurnstileSecretKey: !Ref TurnstileSecretKey
        TurnstileBypassToken: !Ref TurnstileBypassToken
        AllowMockAccess: !Ref AllowMockAccess
        AdminIpWhitelist: !Ref AdminIpWhitelist
        RateLimitMatchPerIp: !Ref RateLimitMatchPerIp
        RateLimitWindowSeconds: !Ref RateLimitWindowSeconds
        CsrfEnforced: !Ref CsrfEnforced
        RobotTestDataTtlHours: !Ref RobotTestDataTtlHours

  ContentModule:
    Type: AWS::Serverless::Application
    DependsOn: PathsGamesApi
    Properties:
      Location: template/content.yaml
      Tags:
        Name: !Sub "pathsgames-${Environment}-ContentModule"
        CostCenter: Paths.games
        Environment: !FindInMap [EnvironmentTags, !Ref Environment, Name]
        ManagedBy: CloudFormation
        Owner: AlNao
        Project: Paths.games.aws.serverless
        version: !Ref Version
      Parameters:
        Environment: !Ref Environment
        EnvironmentTag: !FindInMap [EnvironmentTags, !Ref Environment, Name]
        Version: !Ref Version
        LambdaSystemLogLevel: !Ref LambdaSystemLogLevel
        StoryCacheTtlSeconds: !Ref StoryCacheTtlSeconds
        TableName: !Ref PathsGamesTable
        ApiId: !Ref PathsGamesApi
        AllowMockAccess: !Ref AllowMockAccess

  SeedModule:
    Type: AWS::Serverless::Application
    DependsOn: [PathsGamesApi, PathsGamesAdminApi, AdminIpAuthorizer]
    Properties:
      Location: template/seed.yaml
      Tags:
        Name: !Sub "pathsgames-${Environment}-SeedModule"
        CostCenter: Paths.games
        Environment: !FindInMap [EnvironmentTags, !Ref Environment, Name]
        ManagedBy: CloudFormation
        Owner: AlNao
        Project: Paths.games.aws.serverless
        version: !Ref Version
      Parameters:
        Environment: !Ref Environment
        EnvironmentTag: !FindInMap [EnvironmentTags, !Ref Environment, Name]
        Version: !Ref Version
        LambdaSystemLogLevel: !Ref LambdaSystemLogLevel
        TableName: !Ref PathsGamesTable
        AdminApiId: !Ref PathsGamesAdminApi
        AdminAuthorizerId: !Ref AdminIpAuthorizer
        SeedBcryptHash: !Ref SeedBcryptHash
        AllowMockAccess: !Ref AllowMockAccess

Outputs:
  ApiUrl:
    Description: "API Endpoint URL (public/player surface)"
    Value: !Sub "https://${PathsGamesApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/"
  AdminApiUrl:
    Description: "Admin API Endpoint URL (/api/admin/** only, IP-restricted via authorizer)"
    Value: !Sub "https://${PathsGamesAdminApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/"
  TableName:
    Description: "DynamoDB Table Name"
    Value: !Ref PathsGamesTable
  SeedEndpoint:
    Description: "Dev seed endpoint (on the IP-restricted admin API)"
    Value: !Sub "https://${PathsGamesAdminApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/api/dev/seed"
