AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Parameters:
  Environment:
    Type: String
  TableName:
    Type: String
  ApiId:
    Type: String
  AdminApiId:
    Type: String
    Description: "Id of the dedicated admin HTTP API that serves /api/admin/** routes."
  AdminAuthorizerId:
    Type: String
    Description: "Id of the IP-allow-list Lambda authorizer on the admin HTTP API."
  JwtSecret:
    Type: String
  AllowMockAccess:
    Type: String
    Default: "true"
  AdminIpWhitelist:
    Type: String
    Default: ""
    Description: "Comma-separated allowed IPs for /api/admin/**. Empty = no restriction."

Resources:
  AuthLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/pathsgames-${Environment}-AuthFunction"
      RetentionInDays: 14
      Tags:
        - Key: project
          Value: PathsGames
        - Key: env
          Value: !Ref Environment

  AuthFunction:
    Type: AWS::Serverless::Function
    DependsOn: AuthLogGroup
    Properties:
      FunctionName: !Sub "pathsgames-${Environment}-AuthFunction"
      Runtime: python3.13
      Handler: auth.handler.lambda_handler
      Timeout: 30
      MemorySize: 256
      CodeUri: ../lambda/
      Tags:
        project: PathsGames
        env: !Ref Environment
      Environment:
        Variables:
          TABLE_NAME: !Ref TableName
          ENV: !Ref Environment
          JWT_SECRET: !Ref JwtSecret
          ALLOW_MOCK_ACCESS: !Ref AllowMockAccess
          ADMIN_IP_WHITELIST: !Ref AdminIpWhitelist
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TableName

  AuthIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref ApiId
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt AuthFunction.Arn
      PayloadFormatVersion: "2.0"

  AuthPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref AuthFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/*"

  # Admin API integration + invoke permission (same Lambda, second HTTP API).
  AuthAdminIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref AdminApiId
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt AuthFunction.Arn
      PayloadFormatVersion: "2.0"

  AuthAdminPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref AuthFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${AdminApiId}/*"

  GuestLoginRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiId
      RouteKey: "POST /api/auth/guest"
      Target: !Sub "integrations/${AuthIntegration}"

  ResumeGuestRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiId
      RouteKey: "POST /api/auth/guest/resume"
      Target: !Sub "integrations/${AuthIntegration}"

  RefreshTokenRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiId
      RouteKey: "POST /api/auth/refresh"
      Target: !Sub "integrations/${AuthIntegration}"

  LogoutRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiId
      RouteKey: "POST /api/auth/logout"
      Target: !Sub "integrations/${AuthIntegration}"

  LogoutAllRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiId
      RouteKey: "POST /api/auth/logout/all"
      Target: !Sub "integrations/${AuthIntegration}"

  GetMeRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiId
      RouteKey: "GET /api/auth/me"
      Target: !Sub "integrations/${AuthIntegration}"

  # ── Admin routes — served on the admin HTTP API, gated by the IP authorizer ──
  ListGuestsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref AdminApiId
      RouteKey: "GET /api/admin/guests"
      Target: !Sub "integrations/${AuthAdminIntegration}"
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref AdminAuthorizerId

  GuestStatsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref AdminApiId
      RouteKey: "GET /api/admin/guests/stats"
      Target: !Sub "integrations/${AuthAdminIntegration}"
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref AdminAuthorizerId

  CleanupExpiredGuestsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref AdminApiId
      RouteKey: "DELETE /api/admin/guests/expired"
      Target: !Sub "integrations/${AuthAdminIntegration}"
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref AdminAuthorizerId

  # v0.36.2 — guests not seen for N days, and the matches they leave behind.
  PreviewStaleGuestsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref AdminApiId
      RouteKey: "GET /api/admin/guests/stale"
      Target: !Sub "integrations/${AuthAdminIntegration}"
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref AdminAuthorizerId

  DeleteStaleGuestsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref AdminApiId
      RouteKey: "DELETE /api/admin/guests/stale"
      Target: !Sub "integrations/${AuthAdminIntegration}"
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref AdminAuthorizerId

  GetGuestByUuidRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref AdminApiId
      RouteKey: "GET /api/admin/guests/{uuid}"
      Target: !Sub "integrations/${AuthAdminIntegration}"
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref AdminAuthorizerId

  DeleteGuestRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref AdminApiId
      RouteKey: "DELETE /api/admin/guests/{uuid}"
      Target: !Sub "integrations/${AuthAdminIntegration}"
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref AdminAuthorizerId
