AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Parameters:
  Environment:
    Type: String
  TableName:
    Type: String
  AdminApiId:
    Type: String
    Description: "Id of the dedicated admin HTTP API. Dev endpoints are served here (IP-gated)."
  AdminAuthorizerId:
    Type: String
    Description: "Id of the IP-allow-list Lambda authorizer on the admin HTTP API."
  SeedBcryptHash:
    Type: String
    NoEcho: true
    Description: 'BCrypt hash of the seed users password (dev-only). Never hardcode in source code.'
  AllowMockAccess:
    Type: String
    Default: "true"

Resources:
  SeedLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/pathsgames-${Environment}-SeedFunction"
      RetentionInDays: 14
      Tags:
        - Key: project
          Value: PathsGames
        - Key: env
          Value: !Ref Environment

  SeedFunction:
    Type: AWS::Serverless::Function
    DependsOn: SeedLogGroup
    Properties:
      FunctionName: !Sub "pathsgames-${Environment}-SeedFunction"
      Runtime: python3.13
      Handler: seed.handler.lambda_handler
      Timeout: 30
      MemorySize: 256
      CodeUri: ../lambda/
      Tags:
        project: PathsGames
        env: !Ref Environment
      Environment:
        Variables:
          TABLE_NAME: !Ref TableName
          ENV: !Ref Environment
          SEED_BCRYPT_HASH: !Ref SeedBcryptHash
          ALLOW_MOCK_ACCESS: !Ref AllowMockAccess
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TableName

  # Dev endpoints (/api/dev/**) are served ONLY on the admin HTTP API, gated by the
  # IP-allow-list authorizer — the AWS equivalent of the firewalled 8044 admin port.
  SeedIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref AdminApiId
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt SeedFunction.Arn
      PayloadFormatVersion: "2.0"

  SeedRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref AdminApiId
      RouteKey: "POST /api/dev/seed"
      Target: !Sub "integrations/${SeedIntegration}"
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref AdminAuthorizerId

  # POST /api/dev/cleanup — served by the same function (routes by path).
  CleanupRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref AdminApiId
      RouteKey: "POST /api/dev/cleanup"
      Target: !Sub "integrations/${SeedIntegration}"
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref AdminAuthorizerId

  SeedPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref SeedFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${AdminApiId}/*"
