AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Parameters:
  PermissionsBoundaryArn:
    Type: String
    Default: ""
    Description: "v1.10.0 ARN of the IAM permissions boundary of the roles (empty = none)."
  Environment:
    Type: String
  EnvironmentTag:
    Type: String
    Description: "Value of the Environment tag (dev / test / alpha / beta / production), mapped by the root stack."
  Version:
    Type: String
    Description: "Project version, applied as the `version` tag on every resource."
  LambdaSystemLogLevel:
    Type: String
    Default: WARN
  TableName:
    Type: String
  AdminApiId:
    Type: String
    Description: "Id of the dedicated admin HTTP API. Dev endpoints are served here (IP-gated)."
  AdminAuthorizerId:
    Type: String
    Description: "Id of the IP-allow-list Lambda authorizer on the admin HTTP API."
  SeedBcryptHash:
    Type: String
    NoEcho: true
    Description: 'BCrypt hash of the seed users password (dev-only). Never hardcode in source code.'
  JwtSecret:
    Type: String
    NoEcho: true
    Default: PathsGamesDevSecret2026_MustBeAtLeast32Chars!
    Description: "v0.41.0 - the Auth secret: the seed signs the tokens it hands out with it."
  AllowMockAccess:
    Type: String
    Default: "false"
  # v1.2.0 — the audience of the fake Google tokens (test endpoints only)
  GoogleClientId:
    Type: String
    Default: "paths-games-dev.apps.googleusercontent.com"

Conditions:
  HasPermissionsBoundary: !Not [!Equals [!Ref PermissionsBoundaryArn, ""]]

Resources:
  SeedLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/pathsgames-${Environment}-SeedFunction"
      RetentionInDays: 14
      Tags:
        - Key: Name
          Value: !Sub "/aws/lambda/pathsgames-${Environment}-SeedFunction"
        - Key: CostCenter
          Value: Paths.games
        - Key: Environment
          Value: !Ref EnvironmentTag
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Owner
          Value: AlNao
        - Key: Project
          Value: !Sub "Paths.games.aws.${EnvironmentTag}.serverless"
        - Key: version
          Value: !Ref Version

  SeedFunction:
    Type: AWS::Serverless::Function
    DependsOn: SeedLogGroup
    Properties:
      PermissionsBoundary: !If [HasPermissionsBoundary, !Ref PermissionsBoundaryArn, !Ref AWS::NoValue]
      FunctionName: !Sub "pathsgames-${Environment}-SeedFunction"
      Runtime: python3.13
      Architectures: [arm64]
      LoggingConfig:
        LogFormat: JSON
        SystemLogLevel: !Ref LambdaSystemLogLevel
        ApplicationLogLevel: INFO
      Handler: seed.handler.lambda_handler
      Timeout: 30
      MemorySize: 256
      CodeUri: ../lambda/
      Tags:
        Name: !Sub "pathsgames-${Environment}-SeedFunction"
        CostCenter: Paths.games
        Environment: !Ref EnvironmentTag
        ManagedBy: CloudFormation
        Owner: AlNao
        Project: !Sub "Paths.games.aws.${EnvironmentTag}.serverless"
        version: !Ref Version
      Environment:
        Variables:
          TABLE_NAME: !Ref TableName
          ENV: !Ref Environment
          SEED_BCRYPT_HASH: !Ref SeedBcryptHash
          JWT_SECRET: !Ref JwtSecret
          ALLOW_MOCK_ACCESS: !Ref AllowMockAccess
          GOOGLE_CLIENT_ID: !Ref GoogleClientId
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TableName

  # Dev endpoints (/api/dev/**) are served ONLY on the admin HTTP API, gated by the
  # IP-allow-list authorizer — the AWS equivalent of the firewalled 8044 admin port.
  SeedIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref AdminApiId
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt SeedFunction.Arn
      PayloadFormatVersion: "2.0"

  SeedRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref AdminApiId
      RouteKey: "POST /api/dev/seed"
      Target: !Sub "integrations/${SeedIntegration}"
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref AdminAuthorizerId

  # POST /api/dev/cleanup — served by the same function (routes by path).
  CleanupRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref AdminApiId
      RouteKey: "POST /api/dev/cleanup"
      Target: !Sub "integrations/${SeedIntegration}"
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref AdminAuthorizerId

  # v1.2.0 — the test-only endpoints of Robot: admin token, fake Google token, deletion job.
  DevAdminTokenRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref AdminApiId
      RouteKey: "POST /api/dev/admin-token"
      Target: !Sub "integrations/${SeedIntegration}"
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref AdminAuthorizerId

  DevGoogleTokenRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref AdminApiId
      RouteKey: "POST /api/dev/google-token"
      Target: !Sub "integrations/${SeedIntegration}"
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref AdminAuthorizerId

  DevAccountDeletionRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref AdminApiId
      RouteKey: "POST /api/dev/jobs/account-deletion"
      Target: !Sub "integrations/${SeedIntegration}"
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref AdminAuthorizerId

  # v1.10.0 — Robot ends a suspension now to test the automatic unblock.
  DevExpireSuspensionRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref AdminApiId
      RouteKey: "POST /api/dev/users/{userUuid}/expire-suspension"
      Target: !Sub "integrations/${SeedIntegration}"
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref AdminAuthorizerId

  SeedPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref SeedFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${AdminApiId}/*"
