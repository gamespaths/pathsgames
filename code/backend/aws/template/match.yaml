AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Parameters:
  Environment:
    Type: String
  EnvironmentTag:
    Type: String
    Description: "Value of the Environment tag (dev / test / production), mapped by the root stack."
  Version:
    Type: String
    Description: "Project version, applied as the `version` tag on every resource."
  LambdaSystemLogLevel:
    Type: String
    Default: WARN
  TableName:
    Type: String
  StoryCacheTtlSeconds:
    Type: String
    Default: "3600"
  ApiId:
    Type: String
  AdminApiId:
    Type: String
    Description: "Id of the dedicated admin HTTP API that serves /api/admin/** routes."
  AdminAuthorizerId:
    Type: String
    Description: "Id of the IP-allow-list Lambda authorizer on the admin HTTP API."
  JwtSecret:
    Type: String
    Default: PathsGamesDevSecret2026_MustBeAtLeast32Chars!
  TurnstileSecretKey:
    Type: String
    Default: ""
    Description: "Cloudflare Turnstile secret key. Leave empty to disable validation."
  TurnstileBypassToken:
    Type: String
    NoEcho: true
    Default: ""
    Description: "Optional Robot-test bypass token. When non-empty, an incoming turnstileToken equal to this value skips Cloudflare verification. Leave empty in prod."
  AllowMockAccess:
    Type: String
    Default: "true"
  AdminIpWhitelist:
    Type: String
    Default: ""
  RateLimitMatchPerIp:
    Type: String
    Default: "0"
  RateLimitWindowSeconds:
    Type: String
    Default: "3600"
  CsrfEnforced:
    Type: String
    Default: "true"
    Description: "Comma-separated allowed IPs for /api/admin/**. Empty = no restriction."

Resources:
  MatchLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/pathsgames-${Environment}-MatchFunction"
      RetentionInDays: 14
      Tags:
        - Key: Name
          Value: !Sub "/aws/lambda/pathsgames-${Environment}-MatchFunction"
        - Key: CostCenter
          Value: Paths.games
        - Key: Environment
          Value: !Ref EnvironmentTag
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Owner
          Value: AlNao
        - Key: Project
          Value: Paths.games.aws.serverless
        - Key: version
          Value: !Ref Version

  MatchFunction:
    Type: AWS::Serverless::Function
    DependsOn: MatchLogGroup
    Properties:
      FunctionName: !Sub "pathsgames-${Environment}-MatchFunction"
      Runtime: python3.13
      Architectures: [arm64]
      LoggingConfig:
        LogFormat: JSON
        SystemLogLevel: !Ref LambdaSystemLogLevel
        ApplicationLogLevel: INFO
      Handler: match.handler.lambda_handler
      Timeout: 102  # v0.38.1 — 1m42s: a 2000-VU burst queues on DynamoDB past the old 30s
      # v0.37.5 — 1024 MB: CPU scales with memory, so cold start + DynamoDB fan-out stay under the game client's timeout.
      MemorySize: 1024
      CodeUri: ../lambda/
      Tags:
        Name: !Sub "pathsgames-${Environment}-MatchFunction"
        CostCenter: Paths.games
        Environment: !Ref EnvironmentTag
        ManagedBy: CloudFormation
        Owner: AlNao
        Project: Paths.games.aws.serverless
        version: !Ref Version
      Environment:
        Variables:
          TABLE_NAME: !Ref TableName
          ENV: !Ref Environment
          JWT_SECRET: !Ref JwtSecret
          TURNSTILE_SECRET_KEY: !Ref TurnstileSecretKey
          TURNSTILE_BYPASS_TOKEN: !Ref TurnstileBypassToken
          STORY_CACHE_TTL_SECONDS: !Ref StoryCacheTtlSeconds
          ALLOW_MOCK_ACCESS: !Ref AllowMockAccess
          ADMIN_IP_WHITELIST: !Ref AdminIpWhitelist
          RATE_LIMIT_MATCH_PER_IP: !Ref RateLimitMatchPerIp
          RATE_LIMIT_WINDOW_SECONDS: !Ref RateLimitWindowSeconds
          CSRF_ENFORCED: !Ref CsrfEnforced
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TableName

  MatchIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref ApiId
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt MatchFunction.Arn
      PayloadFormatVersion: "2.0"

  MatchPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref MatchFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/*"

  # Admin API integration + invoke permission (same Lambda, second HTTP API).
  MatchAdminIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref AdminApiId
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt MatchFunction.Arn
      PayloadFormatVersion: "2.0"

  MatchAdminPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref MatchFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${AdminApiId}/*"

  CreateMatchRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiId
      RouteKey: "POST /api/matches"
      Target: !Sub "integrations/${MatchIntegration}"

  ListMatchesRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiId
      RouteKey: "GET /api/matches"
      Target: !Sub "integrations/${MatchIntegration}"

  # ── Admin routes — served on the admin HTTP API, gated by the IP authorizer ──
  ListAllMatchesRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref AdminApiId
      RouteKey: "GET /api/admin/matches"
      Target: !Sub "integrations/${MatchAdminIntegration}"
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref AdminAuthorizerId

  GetMatchInfoRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiId
      RouteKey: "GET /api/match/{uuidMatch}/info"
      Target: !Sub "integrations/${MatchIntegration}"

  # Step 36 — GET /api/match/{uuidMatch}/registry
  GetMatchRegistryRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiId
      RouteKey: "GET /api/match/{uuidMatch}/registry"
      Target: !Sub "integrations/${MatchIntegration}"

  # Step 37 — GET /api/match/{uuidMatch}/missions
  GetMatchMissionsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiId
      RouteKey: "GET /api/match/{uuidMatch}/missions"
      Target: !Sub "integrations/${MatchIntegration}"

  # Step 37 — GET /api/match/{uuidMatch}/missions/{uuidMission}
  GetMatchMissionRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiId
      RouteKey: "GET /api/match/{uuidMatch}/missions/{uuidMission}"
      Target: !Sub "integrations/${MatchIntegration}"

  # Step 20.1 — PATCH /api/match/{uuidMatch}/end/{uuidEvent}
  EndMatchRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiId
      RouteKey: "PATCH /api/match/{uuidMatch}/end/{uuidEvent}"
      Target: !Sub "integrations/${MatchIntegration}"

  # Step 21 — character template & class selection (player API)
  JoinMatchRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiId
      RouteKey: "POST /api/matches/{uuidMatch}/join"
      Target: !Sub "integrations/${MatchIntegration}"

  ListMatchPlayersRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiId
      RouteKey: "GET /api/match/{uuidMatch}/players"
      Target: !Sub "integrations/${MatchIntegration}"

  GetMatchCharacterRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiId
      RouteKey: "GET /api/match/{uuidMatch}/characters/{uuidCharacter}"
      Target: !Sub "integrations/${MatchIntegration}"

  # Step 24 — single-player turn cycle (player API)
  StartMatchRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiId
      RouteKey: "POST /api/matches/{uuidMatch}/start"
      Target: !Sub "integrations/${MatchIntegration}"

  PassTurnRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiId
      RouteKey: "POST /api/gameplay/{uuidMatch}/action/pass"
      Target: !Sub "integrations/${MatchIntegration}"

  GetTurnSequenceRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiId
      RouteKey: "GET /api/match/{uuidMatch}/turn-sequence"
      Target: !Sub "integrations/${MatchIntegration}"

  # Step 38 — experience spent on a stat (player API)
  UseExpRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiId
      RouteKey: "POST /api/gameplay/{uuidMatch}/action/use-exp"
      Target: !Sub "integrations/${MatchIntegration}"

  # Step 25 — time advancement & clock cycle (player API)
  SleepActionRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiId
      RouteKey: "POST /api/gameplay/{uuidMatch}/action/sleep"
      Target: !Sub "integrations/${MatchIntegration}"

  GetClockRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiId
      RouteKey: "GET /api/match/{uuidMatch}/clock"
      Target: !Sub "integrations/${MatchIntegration}"

  # Step 27 — weather system (player API)
  GetWeatherRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiId
      RouteKey: "GET /api/matches/{uuidMatch}/weather"
      Target: !Sub "integrations/${MatchIntegration}"

  # Step 28 — movement system (player API)
  StartMovementRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiId
      RouteKey: "POST /api/gameplay/{uuidMatch}/movements/start"
      Target: !Sub "integrations/${MatchIntegration}"

  # Step 29 — normal events (player API)
  ExecuteEventRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiId
      RouteKey: "POST /api/gameplay/{uuidMatch}/action/execute-event"
      Target: !Sub "integrations/${MatchIntegration}"

  # Step 32 — choice resolution (player API). Without this route API Gateway answers 404
  # before the lambda is ever reached, whatever the handler does.
  SelectChoiceRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiId
      RouteKey: "POST /api/gameplay/{uuidMatch}/action/select-choice"
      Target: !Sub "integrations/${MatchIntegration}"

  # Steps 34 & 35 — inventory and resources (player API). Without these routes API
  # Gateway answers 404 before the lambda is ever reached, whatever the handler does.
  GetInventoryRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiId
      RouteKey: "GET /api/gameplay/{uuidMatch}/inventory"
      Target: !Sub "integrations/${MatchIntegration}"

  UseItemRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiId
      RouteKey: "POST /api/gameplay/{uuidMatch}/inventory/use-item"
      Target: !Sub "integrations/${MatchIntegration}"

  DropItemRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiId
      RouteKey: "POST /api/gameplay/{uuidMatch}/inventory/drop-item"
      Target: !Sub "integrations/${MatchIntegration}"

  GetResourcesRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiId
      RouteKey: "GET /api/gameplay/{uuidMatch}/resources"
      Target: !Sub "integrations/${MatchIntegration}"

  GetLocationsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiId
      RouteKey: "GET /api/match/{uuidMatch}/locations"
      Target: !Sub "integrations/${MatchIntegration}"

  # Step 28.7 — consolidated match log timeline (player API, owner-only)
  GetMatchLogsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiId
      RouteKey: "GET /api/matches/{uuidMatch}/logs"
      Target: !Sub "integrations/${MatchIntegration}"

  # ── admin match control (modify / stop / delete) — admin API + IP authorizer ──
  ListMatchStatusesRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref AdminApiId
      RouteKey: "GET /api/admin/matches/statuses"
      Target: !Sub "integrations/${MatchAdminIntegration}"
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref AdminAuthorizerId

  AdminMatchInfoRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref AdminApiId
      RouteKey: "GET /api/admin/matches/{uuidMatch}/info"
      Target: !Sub "integrations/${MatchAdminIntegration}"
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref AdminAuthorizerId

  # Step 27 — admin weather view (rng_seed + current + log_weather)
  AdminMatchWeatherRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref AdminApiId
      RouteKey: "GET /api/admin/matches/{uuidMatch}/weather"
      Target: !Sub "integrations/${MatchAdminIntegration}"
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref AdminAuthorizerId

  # Step 28 — admin movement view (visited locations + total energy cost)
  AdminMatchLocationsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref AdminApiId
      RouteKey: "GET /api/admin/matches/{uuidMatch}/locations"
      Target: !Sub "integrations/${MatchAdminIntegration}"
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref AdminAuthorizerId

  # v0.36.2 — the console correcting one registry key of a match.
  AdminMatchRegistryPutRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref AdminApiId
      RouteKey: "PUT /api/admin/matches/{uuidMatch}/registry"
      Target: !Sub "integrations/${MatchAdminIntegration}"
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref AdminAuthorizerId

  AdminMatchRegistryDeleteRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref AdminApiId
      RouteKey: "DELETE /api/admin/matches/{uuidMatch}/registry"
      Target: !Sub "integrations/${MatchAdminIntegration}"
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref AdminAuthorizerId

  # Step 28.7 — admin log timeline (no ownership check)
  AdminMatchLogsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref AdminApiId
      RouteKey: "GET /api/admin/matches/{uuidMatch}/logs"
      Target: !Sub "integrations/${MatchAdminIntegration}"
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref AdminAuthorizerId

  UpdateMatchRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref AdminApiId
      RouteKey: "PUT /api/admin/matches/{uuidMatch}"
      Target: !Sub "integrations/${MatchAdminIntegration}"
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref AdminAuthorizerId

  StopMatchRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref AdminApiId
      RouteKey: "POST /api/admin/matches/{uuidMatch}/stop"
      Target: !Sub "integrations/${MatchAdminIntegration}"
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref AdminAuthorizerId

  PauseMatchRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref AdminApiId
      RouteKey: "POST /api/admin/matches/{uuidMatch}/pause"
      Target: !Sub "integrations/${MatchAdminIntegration}"
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref AdminAuthorizerId

  ResumeMatchRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref AdminApiId
      RouteKey: "POST /api/admin/matches/{uuidMatch}/resume"
      Target: !Sub "integrations/${MatchAdminIntegration}"
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref AdminAuthorizerId

  DeleteMatchRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref AdminApiId
      RouteKey: "DELETE /api/admin/matches/{uuidMatch}"
      Target: !Sub "integrations/${MatchAdminIntegration}"
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref AdminAuthorizerId

  ChangeStatisticsAdminRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref AdminApiId
      RouteKey: "POST /api/admin/matches/{uuidMatch}/player/{uuidPlayer}/changeStatistics"
      Target: !Sub "integrations/${MatchAdminIntegration}"
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref AdminAuthorizerId

