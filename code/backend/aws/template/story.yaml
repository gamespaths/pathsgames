AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Parameters:
  Environment:
    Type: String
  LambdaSystemLogLevel:
    Type: String
    Default: WARN
  TableName:
    Type: String
  StoryCacheTtlSeconds:
    Type: String
    Default: "3600"
  ApiId:
    Type: String
  AdminApiId:
    Type: String
    Description: "Id of the dedicated admin HTTP API that serves /api/admin/** routes."
  AdminAuthorizerId:
    Type: String
    Description: "Id of the IP-allow-list Lambda authorizer on the admin HTTP API."
  AllowMockAccess:
    Type: String
    Default: "true"
  AdminIpWhitelist:
    Type: String
    Default: ""
    Description: "Comma-separated allowed IPs for /api/admin/**. Empty = no restriction."
  WebsiteBucket:
    Type: String
    Default: ""
    Description: "v0.37.6 - S3 bucket of the game website; POST /api/admin/stories/catalog writes data/stories-{lang}.json there. Empty = 503."
  WebsiteCloudFrontId:
    Type: String
    Default: ""
    Description: "v0.37.6 - CloudFront distribution of the website, invalidated after a catalog write. Empty = no invalidation."
  CatalogLangs:
    Type: String
    Default: "en,it"

Conditions:
  HasWebsiteBucket: !Not [!Equals [!Ref WebsiteBucket, ""]]
  HasWebsiteCloudFront: !Not [!Equals [!Ref WebsiteCloudFrontId, ""]]

Resources:
  StoryLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/pathsgames-${Environment}-StoryFunction"
      RetentionInDays: 14
      Tags:
        - Key: project
          Value: PathsGames
        - Key: env
          Value: !Ref Environment

  StoryFunction:
    Type: AWS::Serverless::Function
    DependsOn: StoryLogGroup
    Properties:
      FunctionName: !Sub "pathsgames-${Environment}-StoryFunction"
      Runtime: python3.13
      Architectures: [arm64]
      LoggingConfig:
        LogFormat: JSON
        SystemLogLevel: !Ref LambdaSystemLogLevel
        ApplicationLogLevel: INFO
      Handler: story.handler.lambda_handler
      Timeout: 30
      MemorySize: 256
      CodeUri: ../lambda/
      Tags:
        project: PathsGames
        env: !Ref Environment
      Environment:
        Variables:
          TABLE_NAME: !Ref TableName
          ENV: !Ref Environment
          ALLOW_MOCK_ACCESS: !Ref AllowMockAccess
          ADMIN_IP_WHITELIST: !Ref AdminIpWhitelist
          STORY_CACHE_TTL_SECONDS: !Ref StoryCacheTtlSeconds
          WEBSITE_BUCKET: !Ref WebsiteBucket
          WEBSITE_BUCKET_OWNER: !Ref AWS::AccountId
          WEBSITE_CLOUDFRONT_ID: !Ref WebsiteCloudFrontId
          CATALOG_LANGS: !Ref CatalogLangs
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TableName
        # v0.37.6 — static catalog: only the data/ prefix of the website bucket.
        - !If
          - HasWebsiteBucket
          - Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "arn:aws:s3:::${WebsiteBucket}/data/*"
          - !Ref AWS::NoValue
        - !If
          - HasWebsiteCloudFront
          - Statement:
              - Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${WebsiteCloudFrontId}"
          - !Ref AWS::NoValue

  StoryIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref ApiId
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt StoryFunction.Arn
      PayloadFormatVersion: "2.0"

  StoryPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref StoryFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/*"

  # Admin API integration + invoke permission (same Lambda, second HTTP API).
  StoryAdminIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref AdminApiId
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt StoryFunction.Arn
      PayloadFormatVersion: "2.0"

  StoryAdminPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref StoryFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${AdminApiId}/*"

  ListCategoriesRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiId
      RouteKey: "GET /api/stories/categories"
      Target: !Sub "integrations/${StoryIntegration}"

  ListStoriesByCategoryRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiId
      RouteKey: "GET /api/stories/category/{category}"
      Target: !Sub "integrations/${StoryIntegration}"

  ListGroupsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiId
      RouteKey: "GET /api/stories/groups"
      Target: !Sub "integrations/${StoryIntegration}"

  ListStoriesByGroupRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiId
      RouteKey: "GET /api/stories/group/{group}"
      Target: !Sub "integrations/${StoryIntegration}"

  ListStoriesRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiId
      RouteKey: "GET /api/stories"
      Target: !Sub "integrations/${StoryIntegration}"

  GetStoryRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiId
      RouteKey: "GET /api/stories/{uuid}"
      Target: !Sub "integrations/${StoryIntegration}"

  # Step 23: trait listing filtered by class
  ListTraitsForClassRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiId
      RouteKey: "GET /api/stories/{uuidStory}/classes/{uuidClass}/traits"
      Target: !Sub "integrations/${StoryIntegration}"

  # ── Admin routes — served on the admin HTTP API, gated by the IP authorizer ──
  ImportStoryRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref AdminApiId
      RouteKey: "POST /api/admin/stories/import"
      Target: !Sub "integrations/${StoryAdminIntegration}"
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref AdminAuthorizerId

  FlushCacheRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref AdminApiId
      RouteKey: "POST /api/admin/cache/flush"
      Target: !Sub "integrations/${StoryAdminIntegration}"
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref AdminAuthorizerId

  ExportCatalogRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref AdminApiId
      RouteKey: "POST /api/admin/stories/catalog"
      Target: !Sub "integrations/${StoryAdminIntegration}"
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref AdminAuthorizerId

  ListAllStoriesRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref AdminApiId
      RouteKey: "GET /api/admin/stories"
      Target: !Sub "integrations/${StoryAdminIntegration}"
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref AdminAuthorizerId

  GetAdminStoryRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref AdminApiId
      RouteKey: "GET /api/admin/stories/{uuid}"
      Target: !Sub "integrations/${StoryAdminIntegration}"
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref AdminAuthorizerId

  DeleteStoryRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref AdminApiId
      RouteKey: "DELETE /api/admin/stories/{uuid}"
      Target: !Sub "integrations/${StoryAdminIntegration}"
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref AdminAuthorizerId

  # Step 22: GET /api/admin/stories/{uuid}/validate is intentionally NOT declared as a
  # separate route. HTTP API rejects a literal segment ("validate") that sits at the same
  # position as the {entityType} path variable of the entity route below. The existing
  # "GET /api/admin/stories/{uuidStory}/{entityType}" route delivers the request to the
  # Story function, and handler.lambda_handler intercepts any path ending in "/validate"
  # before the entity-listing dispatch.

  CreateStoryRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref AdminApiId
      RouteKey: "POST /api/admin/stories"
      Target: !Sub "integrations/${StoryAdminIntegration}"
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref AdminAuthorizerId

  UpdateStoryRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref AdminApiId
      RouteKey: "PUT /api/admin/stories/{uuidStory}"
      Target: !Sub "integrations/${StoryAdminIntegration}"
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref AdminAuthorizerId

  ListEntitiesRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref AdminApiId
      RouteKey: "GET /api/admin/stories/{uuidStory}/{entityType}"
      Target: !Sub "integrations/${StoryAdminIntegration}"
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref AdminAuthorizerId

  CreateEntityRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref AdminApiId
      RouteKey: "POST /api/admin/stories/{uuidStory}/{entityType}"
      Target: !Sub "integrations/${StoryAdminIntegration}"
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref AdminAuthorizerId

  GetEntityRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref AdminApiId
      RouteKey: "GET /api/admin/stories/{uuidStory}/{entityType}/{entityUuid}"
      Target: !Sub "integrations/${StoryAdminIntegration}"
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref AdminAuthorizerId

  UpdateEntityRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref AdminApiId
      RouteKey: "PUT /api/admin/stories/{uuidStory}/{entityType}/{entityUuid}"
      Target: !Sub "integrations/${StoryAdminIntegration}"
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref AdminAuthorizerId

  DeleteEntityRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref AdminApiId
      RouteKey: "DELETE /api/admin/stories/{uuidStory}/{entityType}/{entityUuid}"
      Target: !Sub "integrations/${StoryAdminIntegration}"
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref AdminAuthorizerId
