AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Parameters:
  Environment:
    Type: String
  TableName:
    Type: String
  ApiId:
    Type: String
  AdminApiId:
    Type: String
    Description: "Id of the dedicated admin HTTP API that serves /api/admin/** routes."
  AdminAuthorizerId:
    Type: String
    Description: "Id of the IP-allow-list Lambda authorizer on the admin HTTP API."
  AllowMockAccess:
    Type: String
    Default: "true"
  AdminIpWhitelist:
    Type: String
    Default: ""
    Description: "Comma-separated allowed IPs for /api/admin/**. Empty = no restriction."

Resources:
  StoryLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/pathsgames-${Environment}-StoryFunction"
      RetentionInDays: 14
      Tags:
        - Key: project
          Value: PathsGames
        - Key: env
          Value: !Ref Environment

  StoryFunction:
    Type: AWS::Serverless::Function
    DependsOn: StoryLogGroup
    Properties:
      FunctionName: !Sub "pathsgames-${Environment}-StoryFunction"
      Runtime: python3.13
      Handler: story.handler.lambda_handler
      Timeout: 30
      MemorySize: 256
      CodeUri: ../lambda/
      Tags:
        project: PathsGames
        env: !Ref Environment
      Environment:
        Variables:
          TABLE_NAME: !Ref TableName
          ENV: !Ref Environment
          ALLOW_MOCK_ACCESS: !Ref AllowMockAccess
          ADMIN_IP_WHITELIST: !Ref AdminIpWhitelist
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TableName

  StoryIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref ApiId
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt StoryFunction.Arn
      PayloadFormatVersion: "2.0"

  StoryPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref StoryFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/*"

  # Admin API integration + invoke permission (same Lambda, second HTTP API).
  StoryAdminIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref AdminApiId
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt StoryFunction.Arn
      PayloadFormatVersion: "2.0"

  StoryAdminPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref StoryFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${AdminApiId}/*"

  ListCategoriesRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiId
      RouteKey: "GET /api/stories/categories"
      Target: !Sub "integrations/${StoryIntegration}"

  ListStoriesByCategoryRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiId
      RouteKey: "GET /api/stories/category/{category}"
      Target: !Sub "integrations/${StoryIntegration}"

  ListGroupsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiId
      RouteKey: "GET /api/stories/groups"
      Target: !Sub "integrations/${StoryIntegration}"

  ListStoriesByGroupRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiId
      RouteKey: "GET /api/stories/group/{group}"
      Target: !Sub "integrations/${StoryIntegration}"

  ListStoriesRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiId
      RouteKey: "GET /api/stories"
      Target: !Sub "integrations/${StoryIntegration}"

  GetStoryRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiId
      RouteKey: "GET /api/stories/{uuid}"
      Target: !Sub "integrations/${StoryIntegration}"

  # ── Admin routes — served on the admin HTTP API, gated by the IP authorizer ──
  ImportStoryRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref AdminApiId
      RouteKey: "POST /api/admin/stories/import"
      Target: !Sub "integrations/${StoryAdminIntegration}"
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref AdminAuthorizerId

  ListAllStoriesRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref AdminApiId
      RouteKey: "GET /api/admin/stories"
      Target: !Sub "integrations/${StoryAdminIntegration}"
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref AdminAuthorizerId

  GetAdminStoryRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref AdminApiId
      RouteKey: "GET /api/admin/stories/{uuid}"
      Target: !Sub "integrations/${StoryAdminIntegration}"
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref AdminAuthorizerId

  DeleteStoryRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref AdminApiId
      RouteKey: "DELETE /api/admin/stories/{uuid}"
      Target: !Sub "integrations/${StoryAdminIntegration}"
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref AdminAuthorizerId

  CreateStoryRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref AdminApiId
      RouteKey: "POST /api/admin/stories"
      Target: !Sub "integrations/${StoryAdminIntegration}"
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref AdminAuthorizerId

  UpdateStoryRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref AdminApiId
      RouteKey: "PUT /api/admin/stories/{uuidStory}"
      Target: !Sub "integrations/${StoryAdminIntegration}"
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref AdminAuthorizerId

  ListEntitiesRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref AdminApiId
      RouteKey: "GET /api/admin/stories/{uuidStory}/{entityType}"
      Target: !Sub "integrations/${StoryAdminIntegration}"
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref AdminAuthorizerId

  CreateEntityRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref AdminApiId
      RouteKey: "POST /api/admin/stories/{uuidStory}/{entityType}"
      Target: !Sub "integrations/${StoryAdminIntegration}"
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref AdminAuthorizerId

  GetEntityRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref AdminApiId
      RouteKey: "GET /api/admin/stories/{uuidStory}/{entityType}/{entityUuid}"
      Target: !Sub "integrations/${StoryAdminIntegration}"
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref AdminAuthorizerId

  UpdateEntityRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref AdminApiId
      RouteKey: "PUT /api/admin/stories/{uuidStory}/{entityType}/{entityUuid}"
      Target: !Sub "integrations/${StoryAdminIntegration}"
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref AdminAuthorizerId

  DeleteEntityRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref AdminApiId
      RouteKey: "DELETE /api/admin/stories/{uuidStory}/{entityType}/{entityUuid}"
      Target: !Sub "integrations/${StoryAdminIntegration}"
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref AdminAuthorizerId
