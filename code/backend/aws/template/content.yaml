AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Parameters:
  Environment:
    Type: String
  EnvironmentTag:
    Type: String
    Description: "Value of the Environment tag (dev / test / production), mapped by the root stack."
  Version:
    Type: String
    Description: "Project version, applied as the `version` tag on every resource."
  LambdaSystemLogLevel:
    Type: String
    Default: WARN
  TableName:
    Type: String
  StoryCacheTtlSeconds:
    Type: String
    Default: "3600"
  ApiId:
    Type: String
  AllowMockAccess:
    Type: String
    Default: "true"

Resources:
  ContentLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/pathsgames-${Environment}-ContentFunction"
      RetentionInDays: 14
      Tags:
        - Key: Name
          Value: !Sub "/aws/lambda/pathsgames-${Environment}-ContentFunction"
        - Key: CostCenter
          Value: Paths.games
        - Key: Environment
          Value: !Ref EnvironmentTag
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Owner
          Value: AlNao
        - Key: Project
          Value: Paths.games.aws.serverless
        - Key: version
          Value: !Ref Version

  ContentFunction:
    Type: AWS::Serverless::Function
    DependsOn: ContentLogGroup
    Properties:
      FunctionName: !Sub "pathsgames-${Environment}-ContentFunction"
      Runtime: python3.13
      Architectures: [arm64]
      LoggingConfig:
        LogFormat: JSON
        SystemLogLevel: !Ref LambdaSystemLogLevel
        ApplicationLogLevel: INFO
      Handler: content.handler.lambda_handler
      Timeout: 30
      MemorySize: 256
      CodeUri: ../lambda/
      Tags:
        Name: !Sub "pathsgames-${Environment}-ContentFunction"
        CostCenter: Paths.games
        Environment: !Ref EnvironmentTag
        ManagedBy: CloudFormation
        Owner: AlNao
        Project: Paths.games.aws.serverless
        version: !Ref Version
      Environment:
        Variables:
          TABLE_NAME: !Ref TableName
          ENV: !Ref Environment
          ALLOW_MOCK_ACCESS: !Ref AllowMockAccess
          STORY_CACHE_TTL_SECONDS: !Ref StoryCacheTtlSeconds
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TableName

  ContentIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref ApiId
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ContentFunction.Arn
      PayloadFormatVersion: "2.0"

  ContentPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ContentFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/*"

  GetCardRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiId
      RouteKey: "GET /api/content/{uuidStory}/cards/{uuidCard}"
      Target: !Sub "integrations/${ContentIntegration}"

  GetTextRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiId
      RouteKey: "GET /api/content/{uuidStory}/texts/{idText}/lang/{lang}"
      Target: !Sub "integrations/${ContentIntegration}"

  GetCreatorRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiId
      RouteKey: "GET /api/content/{uuidStory}/creators/{uuidCreator}"
      Target: !Sub "integrations/${ContentIntegration}"
