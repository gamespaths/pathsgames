# v0.42.0 — Step 42: tests and deploys the AWS backend stage alpha (stack pathsgames-alpha, us-east-1).
# Setup (GitHub Environment "alpha", IAM, first deploy): code/scripts/alpha/README.md.
name: Alpha Deploy - Backend AWS

on:
  push:
    branches: [ main ]
    paths:
      - 'code/backend/aws/**'
  workflow_dispatch:

# One backend deploy at a time; an in-flight deploy is never cancelled.
concurrency:
  group: alpha-deploy-backend-aws
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.13'

jobs:
  deploy:
    name: Test and deploy the AWS backend (alpha)
    runs-on: ubuntu-latest
    environment: alpha

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: code/backend/aws/requirements-test.txt

      - name: Install test dependencies
        working-directory: code/backend/aws
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Run unit tests (gate)
        working-directory: code/backend/aws
        env:
          PYTHONPATH: lambda
        run: pytest tests/ -q

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      # CI=true: no prompt and no AdminIpWhitelist (the stack keeps the list set by set_admin_ip.sh).
      - name: Deploy stage alpha
        env:
          AWS_ALPHA_LAMBDA_JWT_SECRET: ${{ secrets.AWS_ALPHA_LAMBDA_JWT_SECRET }}
          AWS_ALPHA_LAMBDA_TURNSTILE_SECRET_KEY: ${{ secrets.AWS_ALPHA_LAMBDA_TURNSTILE_SECRET_KEY }}
          AWS_ALPHA_SNS_ALARM_EMAIL: ${{ secrets.AWS_ALPHA_SNS_ALARM_EMAIL }}
          AWS_ALPHA_S3_BUCKET_WEBSITE: ${{ secrets.AWS_ALPHA_S3_BUCKET_WEBSITE }}
          AWS_ALPHA_CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.AWS_ALPHA_CLOUDFRONT_DISTRIBUTION_ID }}
          AWS_ALPHA_APIGW_CORS_ORIGINS: ${{ vars.AWS_ALPHA_APIGW_CORS_ORIGINS }}
          AWS_ALPHA_APIGW_CUSTOM_DOMAIN: ${{ vars.AWS_ALPHA_APIGW_CUSTOM_DOMAIN }}
          AWS_ALPHA_ACM_DOMAIN_CERTIFICATE_ARN: ${{ vars.AWS_ALPHA_ACM_DOMAIN_CERTIFICATE_ARN }}
          AWS_ALPHA_ROUTE53_DOMAIN_HOSTED_ZONE: ${{ vars.AWS_ALPHA_ROUTE53_DOMAIN_HOSTED_ZONE }}
          AWS_ALPHA_BUDGETS_LIMIT: ${{ vars.AWS_ALPHA_BUDGETS_LIMIT }}
          AWS_ALPHA_APIGW_THROTTLE_RATE: ${{ vars.AWS_ALPHA_APIGW_THROTTLE_RATE }}
          AWS_ALPHA_APIGW_THROTTLE_BURST: ${{ vars.AWS_ALPHA_APIGW_THROTTLE_BURST }}
          AWS_ALPHA_APIGW_ADMIN_THROTTLE_RATE: ${{ vars.AWS_ALPHA_APIGW_ADMIN_THROTTLE_RATE }}
          AWS_ALPHA_APIGW_ADMIN_THROTTLE_BURST: ${{ vars.AWS_ALPHA_APIGW_ADMIN_THROTTLE_BURST }}
        run: code/scripts/alpha/deploy_backend.sh --auto-confirm
